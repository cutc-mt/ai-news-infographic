# 監視設定
settings:
  check_interval: "6h"  # 1日2回（朝・夕）
  max_new_per_run: 10   # 1回の監視で最大何本まで処理するか
  batch_push: true      # 監視分のインフォグラフィックはまとめてpush
  manual_priority: true # 手動URLは最優先で処理
