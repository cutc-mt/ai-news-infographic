<style>
  :root{
    --bg:#F7F5EF;
    --panel:#FFFFFF;
    --panel2:#EEF1F5;
    --line:#D9DEE6;
    --ink:#1C2733;
    --sub:#5B6B7C;
    --navy:#0B2545;
    --navy-deep:#081B36;
    --navy-soft:#E4EAF2;
    --gold:#C9A227;

    --gold-soft:#F7EFD8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Noto Sans JP",Meiryo,sans-serif;line-height:1.8}

  header.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(11,37,69,.12),transparent 70%)}
  .hero .tag{display:inline-block;background:rgba(11,37,69,.08);color:var(--navy);border:1px solid rgba(11,37,69,.35);font-size:12px;font-weight:700;letter-spacing:.12em;padding:4px 14px;border-radius:999px;margin-bottom:14px}

  .hero p{color:var(--sub);font-size:14px;max-width:800px}

  .hero .meta span{background:rgba(255,255,255,.7);border:1px solid var(--line);padding:3px 12px;border-radius:999px}
  .yomogi-head{display:flex;gap:12px;align-items:flex-start;margin-top:20px;background:rgba(201,162,39,.1);border:1px solid rgba(154,123,30,.35);border-radius:14px;padding:14px 16px}

  .yomogi-head .bubble{position:relative;font-size:13.5px;color:#3B4A5C}
  .yomogi-head .bubble::before{content:"";position:absolute;left:-6px;top:16px;border:6px solid transparent;border-right-color:rgba(154,123,30,.4)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-top:18px}

  .card.full{grid-column:1/-1}

  .card h2{font-size:16.5px;margin-bottom:4px;line-height:1.5;color:var(--navy)}
  .card h2 small{display:block;font-size:11.5px;color:var(--sub);font-weight:600;letter-spacing:.04em;margin-top:2px}
  .badge{display:inline-block;font-size:12.5px;font-weight:800;padding:3px 14px;border-radius:10px;letter-spacing:.04em;margin:8px 0 10px}
  .b-navy{background:linear-gradient(135deg,#153A6B,#0B2545);color:#F5F8FC}
  .b-gold{background:linear-gradient(135deg,#C9A227,#9A7B1E);color:#FFF9E8}
  .b-line{background:rgba(91,107,124,.12);color:var(--sub);border:1px solid var(--line)}

  .pill.up{color:#2E6E4E;border-color:rgba(46,110,78,.5)}

  .card ul{list-style:none;margin-top:6px}

  .card p.body{font-size:13.5px;color:#33404E}
  .yomogi{display:flex;gap:10px;align-items:flex-start;margin-top:14px;background:var(--gold-soft);border:1px solid rgba(154,123,30,.3);border-radius:12px;padding:10px 12px}
  .yomogi .face{flex-shrink:0;width:34px;height:34px;border-radius:50%;background:var(--navy);color:#F5F8FC;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px}
  .yomogi .bubble{position:relative;font-size:12.5px;color:#3B4A5C}

  table.tbl td{color:#33404E;background:#FCFDFF}

  .flow .step{flex:1 1 150px;background:#FCFDFF;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px;color:#33404E}
  .flow .step b{display:block;color:var(--navy);font-size:12px;margin-bottom:2px}

  .stat{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
  .stat .box{flex:1 1 150px;background:#FCFDFF;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
  .stat .box .v{font-size:22px;font-weight:800;color:var(--navy)}
  .stat .box .l{font-size:11.5px;color:var(--sub);margin-top:2px}

  @media(max-width:640px){.hero{padding:26px 18px}.flow .arrow{transform:rotate(90deg);width:100%;text-align:center}}
</style>

<body>
<div class="wrap">

<header class="hero">
  <span class="tag">TANKAN 2026 / ECONOMIC ANALYSIS</span>
  <h1>日銀短観・9月調査を読む<br><span class="hl">業況判断DIは改善、収益計画は大幅上方修正</span>——賃金との距離は?</h1>
  <p>2026年10月1日発表の日銀「短観」。第一ライフ資産運用経済研究所・首席エコノミストの永濱利廣氏が、ヘッドラインの業況判断DIの向こう側にある企業の収益計画の実態、売上高・経常利益を上方修正した業種、想定為替レートと金融政策までを数値ベースで解説します。</p>
  <div class="meta">
    <span>チャンネル: PIVOT（Economics101）</span>
    <span>ゲスト: 永濱利廣氏（第一ライフ資産運用経済研究所 首席エコノミスト）</span>
    <span>公開: 2026年10月</span>
  </div>
  <div class="yomogi-head">
    <div class="face">よもぎ</div>
    <div class="bubble">「DIは改善したけど市場想定よりやや弱かった。でも収益計画は近年まれに見る強さ」——この見出しの裏側を、カード01から順に整理していきます。</div>
  </div>
</header>

<div class="grid">

  <div class="card full">
    <span class="num">CARD 01</span>
    <h2>今回の短観、全体サマリ<small>2026年10月1日発表・9月調査（7月調査との比較）</small></h2>
    <span class="badge b-navy">TANKAN OVERVIEW</span>
    <div class="stat">
      <div class="box"><div class="v">改善▲微弱</div><div class="l">業況判断DIは改善するも市場想定比ではやや弱い</div></div>
      <div class="box"><div class="v">上方修正</div><div class="l">企業の収益計画は近年まれに見る強さ</div></div>
      <div class="box"><div class="v">中小&gt;大企業</div><div class="l">製造業DIの上昇幅は中小企業が上回る</div></div>
    </div>
    <p class="body" style="margin-top:10px">永濱氏の整理では、ヘッドラインの業況判断DIは「改善したが、当初のマーケット想定よりやや弱かった」。一方で、DIの向こう側にある企業の収益計画（売上高・経常利益）を見ると「近年もまれに見る強さ」で、とくに9月調査時点での大企業の収益上方修正は最近のパターンと大きく異なるという。</p>
    <div class="yomogi"><div class="face">よもぎ</div><div class="bubble"><span class="name">よもぎ:</span>「DIはそこそこ、収益計画はかなり強い」——ニュースの見出しだけだと見えない部分が本題、という構図ですね。</div></div>
  </div>

  <div class="card">
    <span class="num">CARD 02</span>
    <h2>業況判断DIとは何か<small>「1社1票」で見る景気実感の指標</small></h2>
    <ul>
      <li>「良い」と答えた企業の割合 −「悪い」と答えた企業の割合</li>
      <li>プラスなら「良い」と見る企業が多数、マイナスなら逆</li>
      <li><b>大企業も中小企業も1社1票</b>。売上規模で重みは変わらない</li>
      <li>直近（現状）と3ヶ月先（先行き）の両方を毎回調査</li>
    </ul>
    <p class="body">大企業向けのDIがメディアのヘッドラインになりやすいのは、株式市場の時価総額ウェイトが大きいから。ただし集計上はどの企業も等しく1票であり、特定の大企業の好業績がDIを直接引き上げる仕組みではない。</p>
    <div class="yomogi"><div class="face">よもぎ</div><div class="bubble"><span class="name">よもぎ:</span>「1社1票」というルールが後の中小企業の話（CARD 06）で効いてきます。まずここを押さえておくと読みやすくなります。</div></div>
  </div>

  <div class="card">
    <span class="num">CARD 03</span>
    <h2>大企業・製造業DIの改善<small>背景は生成AI需要と資源調達の正常化</small></h2>
    <span class="badge b-navy">MANUFACTURING</span>
    <ul>
      <li>最も注目される大企業製造業の現状DIは6月調査から改善</li>
      <li>背景①:<b>生成AI関連需要の恩恵</b>が日本企業にも波及</li>
      <li>背景②:イラン情勢緊迫化によるホルムズ海峡封鎖で生じた石化原料などの調難が最悪期を脱した</li>
      <li>政府は化石燃料の調達先を多様化。とくに米国からの輸入を増やし、価格は6月の急騰からV字で回復</li>
    </ul>
    <p class="body">海峡そのものの通過量は元通りではないものの、調達先の分散によって企業側のコスト押上げ要因は後退した、と永濱氏は分析する。</p>
    <div class="yomogi"><div class="face">よもぎ</div><div class="bubble"><span class="name">よもぎ:</span>「AI需要」と「地政学リスクの緩和」という性質の違う2つの追い風が重なった、というのがDI改善の骨格です。</div></div>
  </div>

  <div class="card">
    <span class="num">CARD 04</span>
    <h2>大企業・非製造業DIは小幅低下<small>水準は高いまま。災害・天候が響く</small></h2>
    <span class="badge b-line">NON-MANUFACTURING</span>
    <ul>
      <li>非製造業の現状DIは水準としては製造業より高いものの、今回は下落</li>
      <li>要因は<b>自然災害と天候不順</b>——外出を伴う業務の多い非製造業に影響</li>
      <li>低下後も依然として高水準を維持</li>
    </ul>
    <p class="body">「現況はまあまあ、でも先行きは両業種とも水準を下げて慎重だ」という報道が多い点について、永濱氏は「近年は景況感の水準が高くなり、先行きは現況よりかなり低めに出る傾向がある」と指摘する。</p>
    <div class="yomogi"><div class="face">よもぎ</div><div class="bubble"><span class="name">よもぎ:</span>先行きDIが下がるのは毎回のパターンで、それ自体を悲観的材料と読むのは早計、という話につながります。</div></div>
  </div>

  <div class="card">
    <span class="num">CARD 05</span>
    <h2>先行きDIの正しい読み方<small>「3ヶ月前の先行き」と比較する</small></h2>
    <span class="badge b-gold">COMPARE</span>
    <ul>
      <li>近年は先行きDIが現況DIより<b>構造的に低めに出る</b></li>
      <li>そこで「今回の先行き」ではなく「3ヶ月前の調査での先行き」と比較する</li>
      <li>大企業製造業:3ヶ月前の先行き比で<b>上昇</b></li>
      <li>大企業非製造業:同じく小幅ながら<b>上昇</b></li>
    </ul>
    <p class="body">先行きの数値が下がったからといって、過度にネガティブにとらえる必要はない——これが永濱氏の読み。比較の基準点をどう置くかで、同じ調査でも印象が変わる好例だ。</p>
    <div class="yomogi"><div class="face">よもぎ</div><div class="bubble"><span class="name">よもぎ:</span>「前回の先行き予想 vs 今回」で比べると実は上振れ、というのは知っておくと報道の受け取り方が変わりますね。</div></div>
  </div>

  <div class="card full">
    <span class="num">CARD 06</span>
    <h2>注目は中小企業の上昇幅<small>大企業を上回る改善は異例のパターン</small></h2>
    <span class="badge b-navy">SME &lt;-&gt; LARGE</span>
    <ul>
      <li>通常、業況判断DIの改善幅は<b>大企業&gt;中小企業</b>が通例</li>
      <li>今回は<b>製造業で中小企業の上昇幅が大企業を上回った</b></li>
      <li>背景は生成AI関連の需要がサプライチェーン全体に波及していること</li>
      <li>DIは1社1票——特定企業の急成長がそのまま平均を引き上げるわけではないため、<b>中小企業全体で景況感が広く改善</b>していると解釈できる</li>
    </ul>
    <p class="body">永濱氏は毎週のように全国で講演し経営者の話を聞く機会があるといい、今回のDIの数字にも「現場感と合致する」としている。</p>
    <div class="yomogi"><div class="face">よもぎ</div><div class="bubble"><span class="name">よもぎ:</span>「大手だけの話でしょ」ではなく、裾野——中小・零細にも届き始めている、というのが今回の大きな変化ですね。</div></div>
  </div>

  <div class="card">
    <span class="num">CARD 07</span>
    <h2>現場エピソード:半導体装置の塗装会社<small>「今期の収益は前年比8倍」</small></h2>
    <span class="badge b-gold">FIELD VOICE</span>
    <div class="stat">
      <div class="box"><div class="v">8倍</div><div class="l">今期・収益の前年比（経営者談）</div></div>
      <div class="box"><div class="v">さらに3倍</div><div class="l">来年度の見込み（同）</div></div>
    </div>
    <p class="body" style="margin-top:10px">岩手県北上の工業団地で出会った半導体製造装置の塗装を手がける中小企業の経営者が、永濱氏にこう語ったという。生成AIブームが半導体製造装置→その周辺部材・工程を支える中小企業まで確実に波及していることの生きた事例だ。</p>
    <div class="yomogi"><div class="face">よもぎ</div><div class="bubble"><span class="name">よもぎ:</span>一社の話ではあるものの、「DIの中小企業の上昇幅が大きい」という統計と現場の実感が一致しているのが説得力です。</div></div>
  </div>

  <div class="card">
    <span class="num">CARD 08</span>
    <h2>収益計画の読み方<small>3ヶ月ごとの「修正」を見るデータ</small></h2>
    <p class="body">短観の収益計画は、各年度の計画が3月→6月→9月→12月と3ヶ月ごとの調査でどう修正されたかを追うのがポイント。</p>
    <ul>
      <li><b>3月調査</b>:前期決算が固まる前なので慎重め・仮置きの計画</li>
      <li><b>6月調査</b>:決算確定を受けて基本は上方修正</li>
      <li><b>9月調査</b>:ここまでの修正幅は例年少ない</li>
    </ul>
    <div class="yomogi"><div class="face">よもぎ</div><div class="bubble"><span class="name">よもぎ:</span>「初回の計画がいくら」より「その後どう動いたか」——マーケットが見るのは修正の方向と幅、という視点ですね。</div></div>
  </div>

  <div class="card">
    <span class="num">CARD 09</span>
    <h2>売上高計画:例年の2倍以上の上方修正<small>2026年度・大企業全産業</small></h2>
    <span class="badge b-navy">REVENUE PLAN</span>
    <div class="stat">
      <div class="box"><div class="v">3%後半</div><div class="l">3月調査時点の伸び計画</div></div>
      <div class="box"><div class="v">→5%後半</div><div class="l">9月調査での水準まで上方修正</div></div>
    </div>
    <ul style="margin-top:10px">
      <li>6月調査で大きく上方修正されたうえ、9月調査で<b>さらに大幅修正</b></li>
      <li>6月→9月の修正幅は例年のパターンを大きく上回る</li>
      <li>価格転嫁の進行に加え、販売数量そのものも増えている可能性</li>
    </ul>
    <div class="yomogi"><div class="face">よもぎ</div><div class="bubble"><span class="name">よもぎ:</span>金額ベースの上方修正が「値上げだけでなく量も増えている」ことを示唆している、というのは注目ポイントです。</div></div>
  </div>

  <div class="card">
    <span class="num">CARD 10</span>
    <h2>経常利益計画:9月調査での大幅増益修正<small>「9月は減益が当たり前」を覆す</small></h2>
    <span class="badge b-gold">PROFIT PLAN</span>
    <ul>
      <li>利益計画は3月に小幅減益でスタート → 6月に上方修正が毎年のパターン</li>
      <li>これまで<b>9月調査では減益計画のままが当たり前</b>だった</li>
      <li>今回は9月短観で<b>大幅な増益上方修正</b>——近年見たことがない水準</li>
      <li>値上げが浸透し、利益を手元に残せる体質に変化した証拠</li>
    </ul>
    <p class="body">コスト上昇は利益への逆風、というのが従来の常識だったが、価格転嫁力が上がったことで様変わりした、と永濱氏。「値上げ拒否症から脱した」という表現でまとめている。</p>
    <div class="yomogi"><div class="face">よもぎ</div><div class="bubble"><span class="name">よもぎ:</span>「9月の上方修正」というタイミング自体が異例、という評価。企業行動の変化を感じさせる数字です。</div></div>
  </div>

  <div class="card full">
    <span class="num">CARD 11</span>
    <h2>賃金との距離:企業は儲かっているのに給料は?<small>労働分配率が過去最低水準</small></h2>
    <span class="badge b-navy">WAGE GAP</span>
    <ul>
      <li>値上げで収益が上がるほどには賃金を増やしていない</li>
      <li>実質賃金のプラスが続いている背景には、政権の物価高対策の効果が大きい</li>
      <li>とくに大企業の<b>労働分配率が過去最低水準を更新</b>——「もっと賃上げできるのに上げていない」状況</li>
      <li>人材流出への危機感が薄い背景には、日本では転職が少ないことがある</li>
