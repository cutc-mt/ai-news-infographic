<body>
<div class="wrap">

<header class="hero">
  <span class="tag">No PRIORS PODCAST 解説</span>
  <h1><span class="hl">ServiceNowに挑む</span>——「私たち全員のための<br>コーディングエージェント」<span class="au">Serval</span> CEO <span class="au">Jake Stauch</span> インタビュー</h1>
  <p>エンタープライズサービス管理の巨人ServiceNowに対し、創業2年半のServalは「コード生成エージェント」を武器に正面から宣戦布告した。AIコーディングの力をIT部門へ、そして人事・経理・法務といった「コードを書かない人々」へまで広げる。その戦略、安全設計、そして「史上最大のエンタープライズソフト企業になる」という妄想じみた計画を、CEO Jake Stauchが語り尽くす。</p>
  <div class="meta">
    <span>出演: Jake Stauch（Serval 共同創業者 兼 CEO）</span>
    <span>チャンネル: No Priors Podcast</span>
    <span>会社設立: 約2年半前</span>
    <span>従業員: 約200名</span>
  </div>
  <div class="alert-head">
    <div class="icon">豹</div>
    <div class="bubble">社名のServal（サーバル）はアフリカの野生ネコ科動物から。俊敏さで巨大な獲物＝ServiceNowに飛びかかる、という比喩が社名に込められている。</div>
  </div>
</header>

<div class="grid">

  <!-- 1 -->
  <div class="card full">
    <h2>01｜今回の主役はココ<small>Servalという会社をひとことで</small></h2>
    <span class="badge b-main">エンタープライズ自動化</span>
    <p><b>Serval</b>は「エンタープライズ自動化・エンタープライズサービス管理」のスタートアップ。社内での質問やヘルプ要求をきっかけに、仕事の面倒な部分を<b>コード生成（codegen）エージェント</b>で自動化するプラットフォームを提供する。歴史的な巨大プレイヤーであるServiceNowと真っ向から競合する。</p>
    <div class="kpi">
      <div class="box"><div class="n">2.5年</div><div class="l">創業からの年月</div></div>
      <div class="box cy"><div class="n">200名</div><div class="l">現従業員数（1月は20名）</div></div>
      <div class="box"><div class="n">IT部門</div><div class="l">主な狙いの顧客層</div></div>
      <div class="box cy"><div class="n">ServiceNow</div><div class="l">正面から置き換えを狙う標的</div></div>
    </div>
    <div class="balloon">
      <div class="face">J</div>
      <div class="bubble"><span class="name">Jake:</span> 私たちはエンタープライズ自動化の会社です。質問して仕事のサポートを得て、楽しめない仕事の多くをコード生成エージェントで自動化する。それがServalのやっていることです。</div>
    </div>
  </div>

  <!-- 2 -->
  <div class="card">
    <h2>02｜問題は前職で発見した<small>Vicata時代にIT部門へ長年聴き続けた2つの質問</small></h2>
    <span class="badge b-main">起源</span>
    <p>Jakeは前職の企業物理セキュリティ企業<b>Vicata</b>で、何年もIT部門に向き合って製品を開発してきた。その際、いつも決まって投げかけていたのが次の2つの質問だ。</p>
    <ul>
      <li>「<b>一番お金をどこに使っていますか？</b>」</li>
      <li>「<b>何が一番嫌いですか？</b>」</li>
    </ul>
    <p>その両方の答えの上位に来たのが<b>ServiceNow</b>だった。「もっといい解があるのでは」と考え始めたのがServal出発点。ただし当時は「どうやったってServiceNowに勝てない」とも思っていた。</p>
    <div class="balloon cy">
      <div class="face cy">M</div>
      <div class="bubble"><span class="name">司会:</span> 素晴らしい会社ですし、これほど多くのことをうまくやってきた相手に、なぜ勝てると思えたのでしょう？</div>
    </div>
  </div>

  <!-- 3 -->
  <div class="card">
    <h2>03｜ServiceNowの3つの不満<small>「強力なのに、いつも6〜12ヶ月遅れている」</small></h2>
    <span class="badge b-cy">顧客の痛み</span>
    <p>顧客がServiceNowに感じていたフラストレーションは大きく3つ。</p>
    <div class="steps">
      <div class="step cy"><span class="no">1</span><b>構築がとにかく大変</b>何を作るにも実装が必要で、コンサルタントを入れるのが当たり前</div>
      <div class="step cy"><span class="no">2</span><b>常に半年〜1年の遅れ</b>欲しい自動化に追いつけず、ビジネスの変化にも取り残される</div>
      <div class="step cy"><span class="no">3</span><b>コストが高騰し続ける</b>時間が経つほど値段は上がっていく一方</div>
    </div>
    <p class="note">5〜10年使う大型オンボーディングフローのような「不変のもの」なら前期投資も合理的。だが日々追いたい自動化には全く合わない、というのが顧客の実感だった。</p>
  </div>

  <!-- 4 -->
  <div class="card cy">
    <h2>04｜「残りの私たち全員のための」コーディングエージェント<small>Coding Agents for the Rest of Us</small></h2>
    <span class="badge b-cy">コア思想</span>
    <p>AI採用の初期主力はコーディングエージェントを社内で使う<b>エンジニア</b>だった。なぜ彼らは安心して使えたのか——<b>コードレビューという安全なプロセス</b>があるから。19歳のインターンでも強力なものを作り、レビューを通してから本番に載せられる。</p>
    <p>Servalは<b>その同じ能力を企業の残り全員に届ける</b>。土台はコーディングエージェントでも、その上に抽象化・ガードレール・統制を重ね、承認・ステージング・監査証跡を実現する。</p>
    <div class="balloon cy">
      <div class="face cy">J</div>
      <div class="bubble"><span class="name">Jake:</span> 世界のほとんどの会社にはソフトウェアエンジニア部門ではなく、IT部門がある。そのIT部門こそが会社の技術を構築・設定している。僕らは彼らのためのAIプラットフォームを作っているんです。</div>
    </div>
  </div>

  <!-- 5 -->
  <div class="card cy">
    <h2>05｜なぜ「個人AIアシスタント」は大企業で通用しないのか<small>Dotのような個人のエージェントとの決定的な違い</small></h2>
    <span class="badge b-cy">構造的な壁</span>
    <p>消費者・中小企業には個人エージェントがうまく機能する。だが大企業では事情が違う、とJakeは指摘する。</p>
    <ul>
      <li>承認をめぐる<b>膨大なプロセス</b>があり、個人個人の権限セットは極めて狭い</li>
      <li>そもそも<b>自前のエージェントを職場に持ち込むこと自体が許可されない</b>ことが多い</li>
      <li>できることは「メールすらろくに読めない」レベルに制限され、自動化の夢は絵に描いた餅</li>
    </ul>
    <p>対してServalは<b>サービスアカウント資格情報や管理者権限</b>と連携できるIT部門経由で設計。厳格で決定論的な承認サイクルの中なら、人々は昇格した権限で強力な操作を行える。</p>
  </div>

  <!-- 6 -->
  <div class="card">
    <h2>06｜Servalの安全設計<small>エージェントに権限を渡す「正しい手順」</small></h2>
    <span class="badge b-main">ガバナンス</span>
    <p>「うちのエージェントにX・Y・Zをやらせたい」——大企業はこの要望に普通は拒否反応を示す。Servalではこう動く。</p>
    <div class="steps">
      <div class="step"><span class="no">1</span><b>アクセス要求を起票</b>エージェント実行前にチケットが自動生成される</div>
      <div class="step"><span class="no">2</span><b>承認プロセス</b>決定論的なワークフローで関係者が承認</div>
      <div class="step"><span class="no">3</span><b>JITアクセス</b>その回だけ・その権限だけをJust-in-Timeで付与</div>
      <div class="step"><span class="no">4</span><b>全記録</b>実行はログ・監査証跡として全て記録される</div>
    </div>
    <div class="balloon">
      <div class="face">J</div>
      <div class="bubble"><span class="name">Jake:</span> 個人エージェントの魔法のような体験より少し面倒だけど、大企業——特に規制業界の大企業がこうした技術を採用するためには、これが現実の条件なんです。</div>
    </div>
  </div>

  <!-- 7 -->
  <div class="card">
    <h2>07｜コンサル依存からの脱却<small>導入は人の手で、その後はPro Servalへ</small></h2>
    <span class="badge b-main">デプロイ戦略</span>
    <p>従来、この領域の技術普及を握ってきたのはアクセンチュアやデロイトのような<b>コンサルファーム</b>だった。Servalはその役割をIT部門の手に取り戻そうとしているが、「人」の役割は残す。</p>
    <ul>
      <li>導入時には<b>デプロイメント・ストラテジスト</b>と<b>配置ソフトウェアエンジニア</b>を現場に送り込み、問題を解決しながら実装を伴走</li>
      <li>導入後の「まだ自動化したい」長い尾に対しては、<b>Pro Serval</b>と呼ぶ自動化エンジニアのチームが継続サポートを提供</li>
    </ul>
    <div class="balloon gd">
      <div class="face gd">J</div>
      <div class="bubble"><span class="name">Jake:</span> ソフトウェアエンジニアリングで判明しているように、仕事への需要は無限にある。だからこそ自動化エンジニアという領域そのものを作ったんです。</div>
    </div>
  </div>

  <!-- 8 -->
  <div class="card gd">
    <h2>08｜初日からの「妄想」<small>リビングルームで交わされた宣戦布告</small></h2>
    <span class="badge b-gd">創業ストーリー</span>
    <p>Servalの2人の創業者は、共同創業者Alexのリビングルームで会社を始めた<b>初日</b>にこう決めたという。</p>
    <ul>
      <li>「<b>史上最大のエンタープライズソフトウェア企業になる</b>」</li>
      <li>大手企業のリストを作り、<b>ServiceNowを丸で囲んで「これに勝つ」</b>と宣言</li>
    </ul>
    <p class="note">Jakeいわく「すべては我々の極めて妄想的な計画通りに進んでいる」——野望に「成長してから気づいた」のではなく、最初からそれを目指して設計した、というのが一貫した主張。</p>
    <div class="balloon gd">
      <div class="face gd">J</div>
      <div class="bubble"><span class="name">Jake:</span> 僕らはその野望の中に成長したんじゃない。最初からそういうつもりで飛び出したんです。</div>
    </div>
  </div>

  <!-- 9 -->
  <div class="card gd">
    <h2>09｜選ばなかった2つの常道<small>レイヤー戦略でも下位市場でもなく「正面突破」</small></h2>
    <span class="badge b-gd">戦略の選択</span>
    <p>巨大インカンベントに挑むスタートアップが普通取る道は2つ。Servalはどちらも選ばなかった。</p>
    <table class="tbl">
      <tr><th>アプローチ</th><th>内容</th><th>代表例</th></tr>
      <tr><td><b>レイヤー戦略</b></td><td>既存大手の上に薄く乗るAI層を作る</td><td>（後方統合に成功した例はViva程度）</td></tr>
      <tr><td><b>下位市場</b></td><td>SMB・ミッドマーケットで同じ価値を提供</td><td>Rippling、初期のHubSpot、Workday/Salesforceの挑戦者たち</td></tr>
      <tr><td><b>正面突破（Serval）</b></td><td>大企業向けにシステム・オブ・レコードそのものを置き換える</td><td>はるかに困難だが勝てば賞金が巨大</td></tr>
    </table>
    <p class="note">初日から大企業向けに作ると、プロダクトの意思決定もチームの組み方も成長の考え方も根本から変わる——後から拡張するのとは別物になる、という判断。</p>
  </div>

  <!-- 10 -->
  <div class="card">
    <h2>10｜なぜServiceNowなのか<small>「コードこそ自動化の正しい表現形式」</small></h2>
    <span class="badge b-main">コア・インサイト</span>
    <p>SalesforceなどではなくServiceNowを選んだ理由。ServiceNowの本質は<b>ワークフロー自動化プラットフォーム</b>であり、その表現形式に問題があると2人は見抜いた。</p>
    <ul>
      <li>ドラッグ＆ドロップのワークフロービルダーは<b>非技術者には複雑すぎ</b>、<b>技術者には腹立たしいほど抽象的すぎる</b>、苦痛の抽象化レイヤー</li>
      <li><b>コード</b>はエンタープライズ自動化を表現する最良の形式</li>
      <li>問題は「コードを書ける人が少なすぎる」こと——そしてAIがそれを解決した</li>
    </ul>
    <div class="balloon">
      <div class="face">J</div>
      <div class="bubble"><span class="name">Jake:</span> コードが自動化の正しい表現で、誰でもコードを書けるようになったなら、より良い自動化プラットフォームが作れる。そして自動化プラットフォームの最良の市場は、巨大レガシーソフト企業に挑むことなんだと気づいた。</div>
    </div>
  </div>

  <!-- 11 -->
  <div class="card">
    <h2>11｜2年半前の「賭け」は当たった<small>検証可能な領域なら、コーディングエージェントは上達する</small></h2>
    <span class="badge b-main">創業時の前提</span>
    <p>創業当時（2年半前）のコード生成は「tap to complete」レベルで<b>全く機能しなかった</b>。それでも挑んだ根拠が「検証可能性」への賭けだ。</p>
    <ul>
      <li>コーディングは<b>検証可能（verifiable）なドメイン</b>であり、ヒルクライム（性能向上）が期待できる</li>
      <li>パスワードリセットや承認取得のような<b>決定論的・手続き的な処理</b>は定義が明確で検証しやすい</li>
      <li>初期は模範例（シード例）を大量に与えてデモを作っていたが、モデルが良くなりすぎて<b>「壊しようがない」状態</b>に。APIが存在する限り自動化できないワークフローはなくなった</li>
    </ul>
    <p class="note">汎用ソフト開発の進歩は本人の想定を超えたほど、とJakeは認めている。</p>
  </div>

  <div class="card full">
    <h2>12｜「Servalは境界であり、ガードレールだ」<small>知能が向上するほど強くなるビジネスモデル</small></h2>
    <span class="badge b-main">最重要メッセージ</span>
    <p>Servalは自社でLLMを開発しない。では何を作っているのか——<b>境界（boundary）とガードレールそのものがプロダクト</b>だ。ルール・承認・プロセス・社内政治の多い大企業が、こうしたツールを安心して大規模に採用するための道を提供する。</p>
    <p>さらにJakeの予測は逆説的だ。エージェントが普及するほど、企業は<b>個人権限を最小権限（least privilege）へと締め上げていく</b>。エージェントを持つ人間が少し権限を超えるだけで、被害は桁違いに膨らむからだ（これは現在のサイバーセキュリティリスクでも実証済み）。権限が狭くなれば例外は常時発生する——そして<b>その例外を承認プロセス・監査証跡・チケット付きで付与するレイヤーこそServal</b>。締め付けが強まるほど、Servalはより重要で不可欠になる。</p>
    <div class="balloon">
      <div class="face">J</div>
      <div class="bubble"><span class="name">Jake:</span> Servalは境界であり、ガードレールです。知能が向上すれば僕らの製品はより強力になるし、顧客はますますその境界を強化したくなる。</div>
    </div>
  </div>

    <span class="badge b-cy">プロダクト</span>
    <p>第一世代のAIツールの課題は「強力なシステムを作れても、顧客がプロダクトの部品を理解するまで訓練が必要」なこと。Servalは答えとして管理エージェント<b>Catalyst</b>を構築した。</p>
    <ul>
      <li>要件を話すと、プロダクトの部品（プリミティブ）へと翻訳してくれる<b>管理者のためのエージェント</b></li>
      <li>自動化の構築だけでなく、承認ルール・権限チェック・ポリシーの設定やシステム更新も担当</li>
      <li>Servalの主なインターフェースは<b>「Servalの使い方を理解しているエージェントとの対話」</b>になる</li>
    </ul>
    <p class="note">「白紙状態」問題（どこから始めればいいか分からない）も解消。エージェントが提案し、説明し、ビルドパートナーとして共存する——利用者の技術力そのものを底上げする効果もある、と司会も指摘した。</p>

    <p>「AIで内製SaaSを作ればソフトウェアカテゴリは消滅する」という議論に対するJakeの分析は明快だ。</p>
    <table class="tbl">
      <tr><th>カテゴリ</th><th>予測</th><th>理由</th></tr>
      <tr><td><b>ポイントソリューション</b></td><td>統合・消滅していく</td><td>数百もあるSaaSアプリは実質数十で足りる。コアプラットフォームに飲み込まれる</td></tr>
      <tr><td><b>システム・オブ・レコード</b>（ERP/HR/ITSM/CRM）</td><td>残存・入れ替わる</td><td>エンタープライズソフトの構築・維持はVibe codingでは経済的に割に合わない</td></tr>

    <span class="badge b-main">今後の波</span>
    <p>放っておいても仕事を見つけて解決してくれるバックグラウンドエージェント。Jakeはこれを「エンタープライズソフトの究極のムーンショット」と呼ぶ。課題は自明のジレンマだ。</p>
    <ul>
      <li><b>自律性が高いほど価値</b>がある——誰も監視（ベビーシッター）したくない</li>

      <li>コードを書いてシステムに作用できてしまうエージェントは<b>「無限大のセキュリティリスク」</b>で、誰もすぐには受け入れられない</li>
    </ul>
    <p>Servalの現実解は<b>能力の段階的エスカレーション</b>。エージェントが「これができれば仕事に役立つ」と申し出て、決定論的ワークフロー単位で権限を承認していく。積み重なればエージェントはほとんどの問題を解ける有能な存在になる——完璧ではないが、無防備な自律性より安全だ。</p>
