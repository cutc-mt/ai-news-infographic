<body>
<div class="wrap">

<header class="hero">
  <span class="badge">2026-11-05｜GitHub Copilot Fusion</span>
  <h1>Copilot Fusion、モデル選びはおまかせ？ 選ぶのは強さだけ</h1>
  <p class="sub">ずんめたラボ「今知っておきたいAI」より ─ ClaudeやGPTなどモデルの名前を覚えなくていい新しい選び方「Copilot Fusion」を、ズンダモンとメタンがやさしく解説。</p>
  <p class="sub">▶ 本編:<a href="https://www.youtube.com/watch?v=q-qb_S9AixM" target="_blank" rel="noopener">Copilot Fusion、モデル選びはおまかせ？ 選ぶのは強さだけ｜今知っておきたいAI（YouTube）</a></p>
</header>

<div class="grid">

  <div class="card">
    <span class="num">1</span>
    <h2>モデル選びから卒業</h2>
    <p>VS CodeでCopilotに話しかけるたび、ClaudeやGPTなど<b>モデルの名前がずらりと並ぶ一覧</b>に悩む人は多いはず。2026年10月に<b>誰でも使えるようになった「Copilot Fusion」</b>なら、その選択自体をCopilotに任せられます。</p>
    <span class="tag">GitHub Copilot</span><span class="tag">Fusion</span>
  </div>

  <div class="card">
    <span class="num">2</span>
    <h2>これまでの悩み: 一番強い＝正解ではない</h2>
    <p>「1番強そうなのを選べばいい」と思いがちですが、<b>簡単な質問にも強いモデルを使うと料金が多くかかる</b>ことが。かといって難しい作業に弱いモデルを選ぶと品質が落ちる——この板挟みがモデル選びの問題でした。</p>
    <span class="tag">課題</span><span class="tag">コスト</span>
  </div>

  <div class="card">
    <span class="num">3</span>
    <h2>Fusionの使い方は「強さ」3段だけ</h2>
    <p>モデル一覧の一番上にある<b>「Copilot Fusion」</b>を選ぶと、画面に表示されるのは3段の選択だけ。この3段を<b>「強さ」</b>と呼び、「その頼みにどれだけ時間と手間をかけて考えるか」の目安になります。</p>
    <div class="meter">
      <span class="m1">スタンダード<small>毎日の作業</small></span>
      <span class="m2">ハイ<small>複雑な作業</small></span>
      <span class="m3">マックス<small>最も深く考える</small></span>
    </div>
  </div>

  <div class="card">
    <span class="num">4</span>
    <h2>決める役が2つに分かれる</h2>
    <p>Fusionでは役割分担が変わります。<b>どのモデルを使うかはCopilotが決め</b>、1つで足りるか複数を組み合わせるかも判断。<b>自分で決めるのは「Fusionを選ぶこと」と「強さ」だけ</b>。作業の途中でモデルを切り替える手間もなくなります。</p>
    <span class="tag">おまかせ</span><span class="tag">自動切り替え</span>
  </div>

  <div class="card">
    <span class="num">5</span>
    <h2>2つの既存機能を1つに統合</h2>
    <p>これまでCopilotには<b>①作業に合うモデルを1つ選ぶ「お任せ選び」</b>と、<b>②複数モデルを組み合わせる機能</b>（試験提供）がありました。Fusionはこの2つを合わせたもので、選ぶのも組み合わせるのも<b>Fusion 1つで完結</b>します。</p>
    <span class="tag">統合</span>
  </div>

  <div class="card full space">
    <span class="num">6</span>
    <h2>中身では「3つの進め方」を自動判別</h2>
    <p>Fusionはまず頼みの中身を見て、よく考える話か・書く話か・直す話か、ファイルを開くような道具を使う話かを分析。そのうえで3つの進め方のどれで進めるかを、<b>頼むたびに</b>決め直します。同じ会話でも次の頼みは別の進め方になることも。</p>
    <div class="steps">
      <div class="step"><b>進め方① 単体で答える</b>簡単な頼みなら1つのモデルでそのまま回答。いつもと同じ感覚。</div>
      <div class="step"><b>進め方② 下書きと判定役</b>速いモデルが下書きを作り、判定役のモデルが十分か判定。不十分なら強いモデルへ引き継ぎ。</div>
      <div class="step"><b>進め方③ みんなで点検</b>1つのモデルが下書きを作り、他のモデルたちが別々に同時に点検。結果をまとめて最初のモデルが修正。</div>
    </div>
  </div>

  <div class="card">
    <span class="num">7</span>
    <h2>進め方②「判定役」のしくみ</h2>
    <p>短い質問の答えならそのまま出力、バグ直しなど難しいものは<b>下書きが不十分なら時点で止めて強いモデルに引き継ぎ</b>。最初から強いモデルを使うと簡単な頼みまで時間も料金もかかるため、この段階分けがコスト削減の鍵。点検の分、単体回答よりは少し遅くなります。</p>
    <span class="tag">判定役</span><span class="tag">コスト最適化</span>
  </div>

  <div class="card">
    <span class="num">8</span>
    <h2>進め方③「同時点検」のしくみ</h2>
    <p>テストの答え合わせを何人もでするイメージ。点検結果は<b>まとめて最初のモデルに渡され、それを元に修正</b>。画面に出るのは直した最後の答えだけで、下書きは見えません。待ち時間は進め方②と同程度。</p>
    <span class="tag">多モデル点検</span>
  </div>

  <div class="card">
    <span class="num">9</span>
    <h2>性能比較: Claude Codeとほぼ同点</h2>
    <p>AI性能を比べる会社の開発試験で、<b>Fusionの最強段マックスは60点</b>（満点は非公表）。比較相手はAnthropicの開発向け道具「Claude Code」に上位モデルOpusを使った構成で、<b>その差は2点以内</b>でした。</p>
    <span class="pill">マックス60点</span><span class="pill">差2点以内</span>
  </div>

  <div class="card">
    <span class="num">10</span>
    <h2>費用は約半分・時間は約4割短縮</h2>
    <p>同じ比較で<b>1作業あたりの費用は約半分</b>、<b>かかった時間も約4割短い</b>という結果に。ほぼ同じ点数で半分の費用は大きな魅力です。</p>
    <span class="pill">費用≈1/2</span><span class="pill">時間≈-40%</span>
  </div>

  <div class="card">
    <span class="num">11</span>
    <h2>ただし「GitHub自身の比較」</h2>
    <p>この数値はGitHub自身が出したもの。モデル性能だけでなく<b>道具の仕組みの差も含まれる</b>可能性があり、X（旧Twitter）でも指摘の声が上がりました。<b>自分の作業で試すのが一番</b>というのが動画の結論です。</p>
    <span class="tag">鵜呑み注意</span>
  </div>

  <div class="card">
    <span class="num">12</span>
    <h2>AT&T技術者の声「無駄な出費が減った」</h2>
    <p>米通信会社AT&amp;Tの技術者いわく、前は難しい作業のために強いモデルを選んだあと、<b>普段の作業に戻すのを忘れがち</b>だったそう。Fusionなら作業ごとに合うモデルを自動選択し、<b>無駄な出費が減った</b>と証言（具体的な削減額は非公開）。</p>
    <span class="tag">実例</span><span class="tag">AT&amp;T</span>
  </div>

  <div class="card">
    <span class="num">13</span>
    <h2>強さ3段の選び方の目安</h2>
    <ul>
      <li><b>スタンダード</b>: 毎日の作業向け。1つのモデルで答える</li>
      <li><b>ハイ</b>: 複雑なバグや複数ファイルにまたがる変更</li>
      <li><b>マックス</b>: 一番深く考えたい作業</li>
    </ul>
    <p>全部マックスにすればいいわけではなく、<b>右の段ほど複数モデルを使って料金がかさむ</b>ことも。普段はスタンダード、困ったらハイが基本。</p>
  </div>

  <div class="card">
    <span class="num">14</span>
    <h2>プランによって使える強さが違う</h2>
    <ul>
      <li><b>スタンダード</b>: Pro／Free／Student でも使用可</li>
      <li><b>Proプランはスタンダードのみ</b>（Free/Studentは自分でモデルを選べずお任せ）</li>
      <li><b>ハイ／マックス</b>: Pro Plus以上＋Business／Enterprise</li>
    </ul>
    <p>※プラン名の「Max」と強さの「マックス」は別物なので要注意。</p>
  </div>

  <div class="card">
    <span class="num">15</span>
    <h2>使える場所と料金のしくみ</h2>
    <p>VS Code、Copilot CLI、アプリ、JetBrains製の開発アプリで利用可。<b>Fusionそのものに追加料金はなく、使ったモデルごとに「AIクレジット」</b>（1クレジット=0.01ドル）でカウント。プランの月額分から減っていきます。マックスは複数モデルを使う分、スタンダードより多く消費することも。</p>
    <span class="pill">30%オフは11月30日まで</span><span class="tag">AIクレジット</span>
  </div>

  <div class="card">
    <span class="num">16</span>
    <h2>透明性と注意点</h2>
    <ul>
      <li><b>使ったモデルは後から確認可能</b>: 答えの下の強さの名前にカーソルを合わせる</li>
      <li><b>捨てた下書きの変更は残ることがある</b>: 進め方②③で下書きが破棄されても、その下書きが変えたファイルは自動では戻らない。<b>変更を確認してから確定</b>を</li>
      <li>会社のプランでは管理者がモデルや初期選択を制限する場合あり</li>
    </ul>
  </div>

  <div class="card">
    <span class="num">17</span>
    <h2>同日のもう1つの発表: エージェントホスト</h2>
    <p>VS Codeチームからは、作業を任せるAI（エージェント）を<b>VS Codeとは別の「エージェントホスト」で動かす</b>仕組みも発表。<b>VS Codeを閉じても作業が止まらず</b>、Copilot CLIやGitHub.comのWeb画面から続きを見られます。その通信用プロトコル「<b>Agent Host Protocol 1.0</b>」も誰でも使える形で公開されました。</p>
    <span class="tag">VS Code</span><span class="tag">Agent Host Protocol</span>
  </div>

  <div class="card">
    <span class="num">18</span>
    <h2>持ち帰りのまとめ</h2>
    <ul>
      <li><b>選ぶのは強さだけ</b>: モデルと進め方はCopilotが決める</li>
      <li><b>どのプランでもスタンダードは使える</b>: ハイ／マックスはPro Plus以上や法人プラン</li>
      <li><b>確定する前に変更を見る</b>: 捨てた下書きの変更も残ることがある</li>
    </ul>
    <div class="balloon">
      <div class="face">🐣</div>
      <div class="bubble">モデルの名前を覚えなくても使えるのだ！　でも、どんなモデルが働いたかは、答えの下でちゃんと確かめるのだ〜。</div>
    </div>
    <p style="margin-top:10px;">本編動画:<a href="https://www.youtube.com/watch?v=q-qb_S9AixM" target="_blank" rel="noopener">「Copilot Fusion、モデル選びはおまかせ？ 選ぶのは強さだけ｜今知っておきたいAI」（ずんめたラボ／YouTube）</a></p>
  </div>
