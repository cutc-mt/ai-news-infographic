<body>
<div class="wrap">

<header class="hero">
  <span class="tag">Claude Code × Codex ── 2026.11.07</span>
  <h1>仕事で使える <span class="hl">Agent Skills おすすめ6選</span> ── 実際に使っているスキルを解説</h1>
  <p>スキルは、日ごろAIに入力しているプロンプトをファイルにした「AIの指示書」。Claudeを開発するAnthropicが発表した「Agent Skills」という仕組みで、GitHubで公開されたものを自分のPCに持ってくれば、誰でも同じ品質で仕事をAIに任せられます。にゃんたがClaude CodeとCodexで実際に使っている6つのスキル（googleapps-cli／フロントエンドスライド／Visual Explainer／読み安／Excalidraw図解／Brag）を、使い方や注意点まで解説します。</p>
  <div class="meta">
    <span>📺 <a href="https://www.youtube.com/watch?v=J_kxKd7wVew">仕事で使えるAgent Skillsおすすめ6選！Claude Code/Codexで実際に使っている便利なスキルを紹介してみた</a></span>
    <span>チャンネル: にゃんたのAIチャンネル (@aivtuber2866)</span>
    <span>公開: 2026-11-07</span>
  </div>
  <div class="leadbox">
    <div class="icon">🐱</div>
    <div class="bubble">にゃんた「スキルはたくさん出すぎて何がいいか分からない、という人も多いはず。今回はボクが仕事で実際に使っていいなと思った6つだけを厳選して紹介するニャ。」── Google操作、スライド、図解、日本語、動画と、仕事の幅がぐっと広がる6本を持ち帰ります。</div>
  </div>
</header>

<div class="grid">

  <div class="card">
    <span class="num">01</span>
    <span class="badge b-main">今日のテーマ</span>
    <h2>スキルが多すぎて何を使えばいいか分からない、へ<small>仕事で本当に使える6つだけを厳選</small></h2>
    <p>Claude CodeやCodexを普段使いしている人でも、<b>おすすめのスキルが多すぎてどれを使えばいいか分からず、結局使っていない</b>という人は多い。本動画では、にゃんたが実際の仕事の中で「これはいい」と感じたスキルだけを、誰にでも分かるように解説していく。</p>
    <ul>
      <li>① googleapps-cli ── Gmail・Drive・MeetなどGoogleのサービスをAIから操作</li>
      <li>② フロントエンドスライド ── 動きのあるHTMLスライドを作る</li>
      <li>③ Visual Explainer ── 難しい文章を図解に変える</li>
      <li>④ 読み安 ── AIっぽい日本語を自然な文章に直す</li>
      <li>⑤ Excalidraw図解 ── 手書き風の図をAIに描かせる</li>
      <li>⑥ Brag ── 人に自慢したくなる動画を一発で作る</li>
    </ul>
  </div>

  <div class="card">
    <span class="num">02</span>
    <span class="badge b-gold">基礎をおさらい</span>
    <h2>そもそも「スキル」とは何か<small>正式名称は Agent Skills ── Anthropicが発表した仕組み</small></h2>
    <p>スキルの正式名称は<b>「Agent Skills（エージェントスキルズ）」</b>で、Claudeの言語モデルを開発している<b>Anthropicが発表した仕組み</b>。簡単に言うと<b>AIの指示書</b>だ。いつもAIにお願いする仕事をプロンプトで書いている人は多いが、それをファイルとして置いておいてAIに読ませて仕事をさせる、というもの。</p>
    <div class="bubble"><span class="who">にゃんた</span><span class="txt">毎回プロンプトを打つのがスキルを渡すだけで、AIが毎回同じ手順で仕事をしてくれるようになるのだ。</span></div>
  </div>

  <div class="card">
    <span class="num">03</span>
    <span class="badge b-main">SKILL.md の中身</span>
    <h2>仕事の手順を書いたマークダウンファイル<small>議事録の例で見る、再現性の高さ</small></h2>
    <p>実態は<b>SKILL.mdというマークダウンファイル</b>に、仕事の手順を文章で書いておく。例えば会議の議事録をまとめさせるなら、<b>「文字起こしが渡されたら、最初にタイトルをつけて出席者を書き、箇条書きで決まったことを書き、最後に宿題を書く」</b>といった、自分の職場流のまとめ方を書いておくのだ。</p>
    <div class="flow">
      <div class="step"><b>手順1</b>仕事の進め方をSKILL.mdに書く</div>
      <div class="step"><b>手順2</b>仕事を頼む時にSKILL.mdをAIに渡す</div>
      <div class="step"><b>手順3</b>毎回同じ手順で処理 ── 再現性が高い</div>
    </div>
    <p>特定のプログラムを実行させたい場合はそのコードを<b>一緒にパッケージ化</b>しておけば、AIが手順に従って実行してくれる。</p>
  </div>

  <div class="card">
    <span class="num">04</span>
    <span class="badge b-gold">共有と導入</span>
    <h2>GitHubに公開されたスキルを自分のPCに<small>ただのファイルの詰め合わせだから共有も簡単</small></h2>
    <p>作ったスキルは実態として<b>マークダウンファイルとプログラムのコード</b>にすぎない。だからパッケージ化して他の人に渡せば、その人も同じように使える。<b>いろんな人が便利なスキルを開発してGitHub上で公開している</b>ので、これを自分のパソコンに持ってくれば、ある程度の品質で仕事を任せられるというわけだ。</p>
    <div class="note"><div class="ic">📥</div><div class="bubble2">いいなと思ったスキルは、どんどん自分の環境に導入して試してみるのがおすすめ。ただし入れ方の安全には後述の注意点あり。</div></div>
  </div>

  <div class="card">
    <span class="num">05</span>
    <span class="badge b-main">スキル① googleapps-cli</span>
    <h2>AIからGoogleの主要サービスを直接操作<small>Gmail・Drive・Meet・Chat に対応</small></h2>
    <p>1つ目は<b>googleapps-cli</b>。仕事でGmailやGoogleドライブなどGoogleのサービスを使っている人におすすめのスキルで、導入すると<b>AIから主要なGoogleサービスを利用できる</b>ようになる。ClaudeやChatGPTにもコネクター機能で1つずつ接続する方法はあるが、このCLIは<b>Google MeetやGoogle Chatまで使える</b>など対応範囲が広い。</p>
    <ul>
      <li>コネクター接続より扱えるサービスが多い</li>
      <li>Google Meet・Google Chat もAIから操作可能</li>
      <li>Googleを普段使いの人は「めちゃくちゃいい」レベル</li>
    </ul>
  </div>

  <div class="card">
    <span class="num">06</span>
    <span class="badge b-gold">① 最大の強み</span>
    <h2>複数のGoogleアカウントをまたいで作業<small>仕事用・個人用をAIが切り替えて使う</small></h2>
    <p>普通のチャットサービスでGoogleに接続すると<b>1つのアカウントにしか紐づかない</b>。A・B・Cと複数のアカウントを持っていたら、それぞれのGmailを見て請求書をまとめる、といった使い方がしたくなるはず。このCLIなら<b>認証の設定フォルダーを分けておけば、AIがアカウントを選んで操作してくれる</b>。</p>
    <div class="bubble"><span class="who">にゃんたの実例</span><span class="txt">個人用と会社用の両方のメールを見て、問い合わせが来ていたら1つのGoogleカレンダーに登録する、という運用をClaudeに任せている。</span></div>
  </div>

  <div class="card">
    <span class="num">07</span>
    <span class="badge b-main">① 活用の流れ</span>
    <h2>メールのやり取りからミーティングまで一発で完結<small>Meetリンク発行 → 送信 → カレンダー登録</small></h2>
    <p>お客さんとメールのやり取りをしていて「途中でミーティングしたい」となったときも、このCLIなら<b>全部で一発</b>。Google Meetを普段使いの人には特に便利なワークフローだ。</p>
    <div class="flow">
      <div class="step"><b>STEP 1</b>Google Meetのリンクを発行</div>
      <div class="step"><b>STEP 2</b>そのリンクをGmailで送信</div>
      <div class="step"><b>STEP 3</b>カレンダーにも登録しておく</div>
    </div>
    <p>バラバラに操作していた手作業が、AIへのひとことで済むようになる。</p>
  </div>

  <div class="card">
    <span class="num">08</span>
    <span class="badge b-gold">① セットアップ</span>
    <h2>初期設定は面倒 ── でもComputer Useに任せれば楽<small>Google CloudとNode.jsの準備が必要</small></h2>
    <p>デメリットは<b>セットアップが面倒</b>なこと。内部的には<b>gwsというコマンド</b>を実行しながらGoogleのサービスを利用するため、<b>Google Cloudのセットアップと、コマンドを動かすためのNode.js</b>の準備が最初に必要になる。ただ、<b>Computer Useを使えばセットアップ込みでほぼ全部やってくれる</b>。</p>
    <ul>
      <li><b>ChatGPTのComputer Useがおすすめ</b> ── ブラウザーを自由に操作できるので、URLを渡して「セットアップして」と頼めば大体やってくれる</li>
      <li>ClaudeのComputer Useは、ログイン中のGoogleアカウントのブラウザーしか操作できないなどの制約あり</li>
      <li>認証情報を扱うため<b>リスクはある</b>。やる場合は自己責任で</li>
    </ul>
  </div>

  <div class="card">
    <span class="num">09</span>
    <span class="badge b-main">スキル② フロントエンドスライド</span>
    <h2>動きのあるスライドでテンションを上げる<small>PowerPointよりおしゃれなHTMLスライド</small></h2>
    <p>2つ目は<b>フロントエンドスライド</b>。外部サービスを使うものではなく、<b>スライドを作る時に動きを入れながら作れる</b>スキルだ。ページの切り替え時に動きがあるだけでなく、<b>完成品はHTMLなのでそのまま共有できる</b>。資料を少し華やかにしたい時に気持ちが上がる、という趣向のスキル。</p>
    <div class="bubble"><span class="who">にゃんた</span><span class="txt">Opus 5.5は性能が高くて自力でも作れるけど、「動くスライドの作り方が分からない」という人は、このスキルを出発点に自分なりに改造していくのが効率的なのだ。</span></div>
  </div>

  <div class="card">
    <span class="num">10</span>
    <span class="badge b-gold">② 導入と使い方</span>
    <h2>URLを貼って「使えるようにして」だけでOK<small>ビジュアル系はClaudeのOpus 5.5がおすすめ</small></h2>
    <p>導入は簡単で、<b>紹介コマンドをClaude Codeで打つ</b>か、それすら面倒なら<b>スキルのURLをコピーしてClaude Codeに貼り、「これを使えるようにして」と入力するだけ</b>。セットアップの方までやってくれる。</p>
    <ul>
      <li>スライドのデザインは、以前紹介した<b>デザインシステムを組み合わせる</b>と見やすい色・フォントに整う</li>
      <li>デザインの綺麗さは<b>GPTよりClaudeのモデルが上</b></li>
      <li>ビジュアル関係を作るなら、現時点では<b>Opus 5.5</b>がおすすめ</li>
    </ul>
  </div>

  <div class="card">
    <span class="num">11</span>
    <span class="badge b-main">スキル③ Visual Explainer</span>
    <h2>難しい文章を「図解」で分かりやすく変換<small>初めて聞く業務も、図でイメージを膨らませる</small></h2>
    <p>3つ目は<b>Visual Explainer</b>。名前の通り<b>資料を分かりやすくする</b>スキルで、難しい文章を図解に変換してくれる。初めて聞く業務の内容はさっぱり分からない状態からスタートすることも多いが、言語モデルに「分かりやすく説明して」と頼むと文章は綺麗にまとまっても<b>図がないと概念をイメージするのが大変</b>。このスキルを使えば<b>図をふんだんに盛り込んだ資料</b>に変わる。</p>
    <div class="stats">
      <div class="s"><span class="v">図解</span><span class="l">情報の密度をほどよく保って理解しやすく</span></div>
      <div class="s"><span class="v">低負荷</span><span class="l">読む側の理解のストレスが減る</span></div>
    </div>
  </div>

  <div class="card">
    <span class="num">12</span>
    <span class="badge b-gold">③ 使いどころ</span>
    <h2>人間が1日に向けられる注意の量には限界がある<small>情報を「いかに負荷なく処理するか」が重要</small></h2>
    <p>AIは情報処理の能力がどんどん高くなっているが、<b>1日の中で人間が注意を向けられる量は限られている</b>。だからこそ、いかに負荷をかけずに情報を処理できるかは重要なテーマだ。</p>
    <ul>
      <li>疲れている時に情報がみっちり詰まった資料を読みたくない ── そんな時に図解版が効く</li>
      <li>人に共有する資料も、<b>図が多いものを渡すと相手も読みやすい</b></li>
      <li>導入は簡単。<b>迷ったらURLを貼ってClaude Codeに聞く</b>だけで試せる</li>
    </ul>
    <div class="note"><div class="ic">🎨</div><div class="bubble2">配色やフォントが気になる時も、デザインシステムを噛ませれば見た目の整った図解ドキュメントに変換してくれる。</div></div>
  </div>

  <div class="card">
    <span class="num">13</span>
    <span class="badge b-main">スキル④ 読み安</span>
    <h2>AIっぽい日本語を、日本人が読みやすい文章に<small>日本人開発者が公開しているスキル</small></h2>
    <p>4つ目は<b>読み安（よみやす）</b>。<b>日本の方が開発して公開してくださっているスキル</b>で、AIが生成した不自然な日本語・曖昧な修飾関係・不要な装飾を直し、<b>日本人にとって読みやすい文章</b>に整えてくれる。SKILL.mdの中に「何を直して何を直さないか」がびっしり書き込まれており、AIっぽい言い回しの扱いまで細かく決まっている、作り込みの深いスキルだ。</p>
    <div class="bubble"><span class="who">AIっぽさの例</span><span class="txt">文中にダッシュ（横棒）を入れて補足する言い回しなど。「AIが書いたと分かると評価が下がる」という研究もあり、人に渡す文章では特に気になるポイント。</span></div>
  </div>

  <div class="card">
    <span class="num">14</span>
    <span class="badge b-gold">④ 翻訳にも使える</span>
    <h2>英語論文の翻訳を3パターンで比較<small>注意点はトークン消費が多めなこと</small></h2>
    <p>にゃんたは海外の記事を日本語で読みたい時にこの読み安を使っている。英語の論文で<b>「普通に日本語訳」「一度翻訳してから読み安で変換」「英語から直接読み安で翻訳」</b>の3つを比較したところ、一度日本語にしたものを変換すると穏やかな調整にとどまるのに対し、<b>英語から直接変換すると無駄な文章や装飾がごっそり削れて読みやすい</b>という印象だった。</p>
    <ul>
      <li>「近年来の言語モデルは〜」のような <b>冗長な言い回しが削られる</b></li>
      <li>AIがつい付けてしまう無駄な装飾もカット</li>
      <li><b>注意点：</b>スキル本文が全部コンテキストに入るため、<b>使用量（トークン）の消費は激しめ</b>。文章をよく読む人ほど元が取れる</li>
    </ul>
  </div>

  <div class="card">
    <span class="num">15</span>
    <span class="badge b-main">スキル⑤ Excalidraw図解</span>
    <h2>手書き風の図を、入力ひとことで描かせる<small>図がテキストでできているから後から直せる</small></h2>
    <p>5つ目は<b>Excalidraw（エクスカリドロー）図解スキル</b>。手書きで描いたような図が書けるソフト「Excalidraw」の上で、入力した内容を図解してくれる。「Excalidrawの良さを説明する図を作って」と頼むだけでも、<b>それなりの図解が一発ででき上がる</b>。</p>
    <ul>
      <li><b>図がテキストでできている</b>ので、AIが描いた後に人が色を変えたり微修正したりできる</li>
      <li>PowerPointに概念図を入れたい時は、Excalidrawで作ってコピー＆貼り付け</li>
      <li>難しい概念を説明しながら議論する時に、図を編集しながら会話できる</li>
      <li><b>弱点：</b>図の生成に<b>トークンをかなり消費する</b>ので使いどころは選ぶ</li>
    </ul>
  </div>

  <div class="card">
    <span class="num">16</span>
    <span class="badge b-gold">スキル⑥ Brag</span>
    <h2>人に自慢したくなる動画を一発で作る<small>「Brag＝自慢する」── 個人でもMotion級のクオリティ</small></h2>
    <p>最後は<b>ブラッグ（Brag）</b>。英語で「自慢する」という意味で、その名の通り<b>人に自慢したくなるような動画を作れるスキル</b>。Opus 5.5になって綺麗なビジュアルを作る能力が大きく上がり、プロモーションビデオを作らせるのが流行っているが、作り方がイメージできない人でも、<b>「エージェントスキルズについて説明する動画を作って」と入力するだけで</b>、音楽付きのいい感じの動画ができ上がる。</p>
    <ul>
      <li>公式の<b>Claude Motion</b>（動画生成機能）は現状<b>チーム／エンタープライズプランのみ</b></li>
      <li>中身はOpusにプロンプトを設定しているだけなので、<b>このスキルなら個人でも同じくらいのクオリティ</b></li>
      <li>他にも<b>Hyperframes</b>や<b>Remotion</b>といった動画生成スキルの選択肢がある</li>
    </ul>
    <div class="note"><div class="ic">🎬</div><div class="bubble2">にゃんた自身も動画の最後に流す3Dアニメーションを、このBragのスキルをアレンジして作っている。</div></div>
  </div>

  <div class="card">
    <span class="num">17</span>
    <span class="badge b-main">安全に使うコツ</span>
    <h2>入れる前に配布元を確認しよう<small>よく分からないスキルは悪意あるコードのリスク</small></h2>
    <p>スキルはいろんな人が公開していて気軽に自分のPCに入れられるが、その分<b>配布元がよく分からないものや、GitHubのスター数が低く注目されていないもの</b>を入れるときは、<b>悪意あるコードが紛れているリスクも上がる</b>。</p>
    <ul>
      <li>何でもかんでも入れず、<b>心配ならAnthropicなど公式・有名企業が出しているものだけ</b>に絞る</li>
      <li>認証情報を扱うスキル（例：googleapps-cli）は取り扱いに注意</li>
      <li>分からないものは入れない ── 動画の最後のアニメでも一貫してこの注意が描かれた</li>
    </ul>
    <div class="bubble"><span class="who">にゃんた</span><span class="txt">便利そうでも、配布元がよく分からないものは抜いておくのが安心なのだ。スキル選びは「使う前に配布元を確認」これだけ覚えて帰ってほしいのだ。</span></div>
  </div>

  <div class="card full">
    <span class="num">18</span>
    <span class="badge b-gold">まとめ</span>
    <h2>持ち帰りは3つ ── GoogleはCLI、資料は図解と読み安、動画はBrag<small>自分のベストスキルもぜひコメントで教えて</small></h2>
    <p>スキルは、仕事の手順を書いたSKILL.mdをAIに渡すだけで再現性高く仕事を任せられる仕組み。今回の6選は、Googleサービスの一括操作から動くスライド、図解、自然な日本語、手書き風図、プロモーション動画まで、仕事の幅を一気に広げてくれるラインナップだった。導入はどれも「URLを貼ってClaude Codeに頼む」だけで試せるので、気になったものから触ってみてほしい。</p>
    <div class="flow">
      <div class="step"><b>1つ目</b>Google業務はgoogleapps-cli（複数アカウント対応）</div>
      <div class="step"><b>2つ目</b>資料はフロントエンドスライド・Visual Explainer・読み安・Excalidrawで整える</div>
      <div class="step"><b>3つ目</b>動画はBrag ── そして導入前に配布元の確認を忘れずに</div>
    </div>
    <div class="note"><div class="ic">▶</div><div class="bubble2">スキルの導入手順や実際の作例は元動画で確認できます：にゃんたのAIチャンネル「仕事で使えるAgent Skillsおすすめ6選！Claude Code/Codexで実際に使っている便利なスキルを紹介してみた」（書籍「Claude Codeエージェントの教科書」も好評発売中）</div></div>
  </div>
