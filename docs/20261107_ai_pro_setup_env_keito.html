<header class="hero">
  <span class="tag">KEITO流 AIエコシステム ── 2026.11.07</span>
  <h1>入り口はClaude Code一択 ── AIガチ勢の<span class="hl">PC内AI環境</span>を図解で公開</h1>
  <p>「AIに指示しても思った結果にならない」「エージェントがどこまでできるか分からない」──そんな人のために、KEITO氏が自分のパソコンに入っているAI環境を1枚の図にまとめて解説。ハーネスや権限の安全設定、判断AIによる品質ゲート、大量のエージェントスキル、ナレッジ管理、MCP・外部API連携、サブエージェントによる並列処理まで、再現性高く毎回同じクオリティを出す仕組みの全体像を公開する。</p>
  <div class="meta">
    <span>📺 <a href="https://www.youtube.com/watch?v=8XbqxjJOP08">【本気でAI活用したい人向け】AIガチ勢のAI環境を徹底解説！</a></span>
    <span>チャンネル: KEITO【AI&WEB ch】 (@keitoaiweb)</span>
    <span>公開: 2026-11-07</span>
  </div>
  <div class="leadbox">
    <div class="icon">🤖</div>
    <div class="bubble">今回は僕のパソコン上のAI環境を図でまとめて解説するよ。入り口の道具、安全に動かす仕組み、スキル・ナレッジ・外部連携・出口まで、①指示の入口 ②権限と安全設定 ③振り分けの4ルート ④ナレッジと実例フロー、の順番で見ていこう。</div>
  </div>
</header>

<div class="grid">

  <div class="card">
    <span class="num">01</span>
    <span class="badge b-main">今日のテーマ</span>
    <h2>「AIガチ勢」のPCの中身を1枚の図にまとめた<small>再現性の高いAI環境の全体像を公開</small></h2>
    <p>AIに指示を出しても思った結果にならない、SNSで流行りのことをやってもうまくいかない──その原因は<b>環境の作り込み</b>にある。KEITO氏は自PCのAIエコシステムを図に起こし、<b>AIがどう動き・どう判断し・何が入っているか</b>を可視化。細かい環境を1個ずつ作り込むことがAIエージェント活用で一番大事、というのが結論だ。</p>
    <ul>
      <li>図（AIエコシステム図鑑）を公開し、視覚的に解説</li>
      <li>環境を作り込めば毎回同じクオリティの成果物が出る</li>
      <li>図鑑は公式LINEからPDFで配布、Claude Codeに見せれば再現できる</li>
    </ul>
  </div>

  <div class="card">
    <span class="num">02</span>
    <span class="badge b-gold">入口の道具</span>
    <h2>指示の入り口はClaude Code一択<small>スマホ・ターミナル・Discordの3ルート</small></h2>
    <p>「CodexとClaude CodeとGemini、どれを使ってる?」とよく聞かれるが、KEITO氏が直接使うのは<b>Claude Codeだけ</b>。CodexやGemini（Antigravity）はClaude Code側が呼び出して使う存在だ。入口の道具は3つ用意している。</p>
    <div class="layer"><div class="ln">1</div><div class="lt"><b>スマホアプリのリモートコントロール</b>遠くのパソコンを遠隔操作して指示</div></div>
    <div class="layer"><div class="ln">2</div><div class="lt"><b>ターミナル</b>1年前から使っている名残。今はデスクトップアプリでも同じことが可能</div></div>
    <div class="layer"><div class="ln">3</div><div class="lt"><b>Discordボット</b>仕事のやり取りをまとめ、ニュース・YouTubeアイデア・メールを毎日定期まとめ</div></div>
  </div>

  <div class="card">
    <span class="num">03</span>
    <span class="badge b-main">最初の関門</span>
    <h2>指示はまず「ハーネス・権限・安全設定」を通る<small>判断・権限・安全のゲートが全体の土台</small></h2>
    <p>Claude Codeに指示を投げると、最初に<b>ハーネス判断・権限・安全設定</b>の層を通る。ここがKEITO環境のこだわりポイント其一で、何をどこまで許すかを先に固定しておくことで、以降の作業が安心して走る設計だ。ルールは主に4部構成で、次カード以降の判断AI・フック・権限設定・.envがそれぞれ担当する。</p>
    <div class="bubble"><span class="who">ここが最重要</span><span class="txt">AIに自由だけ渡すのではなく、「判断させるAI」「許可された操作だけ」「安全な鍵管理」を仕組みとして先に置く。これが毎回安定した品質の前提になる。</span></div>
  </div>

  <div class="card">
    <span class="num">04</span>
    <span class="badge b-gold">判断AI</span>
    <h2>判断AI「ジェブ」をすべてのやり取りに挟む<small>テキスト評価は毎回ジェブで品質ゲート</small></h2>
    <p>最大の工夫が、タイプセーフAIの<b>判断AI「ジェブ」</b>を人間対AI、サブエージェントとのやり取りなど<b>すべての間に割り込ませる</b>設計。ナレッジとの差がどれくらいあるか、日本語の言い回しの品質、段取りが適切か、最終アウトプットが100%のクオリティか──を毎回評価させる。</p>
    <ul>
      <li>最初の段取りはこの進め方で合っているか</li>
      <li>日本語の言い回しは自然で下手な表現がないか</li>
      <li>完成物は要求どおりのクオリティになっているか</li>
    </ul>
  </div>

  <div class="card">
    <span class="num">05</span>
    <span class="badge b-main">画像の判断</span>
    <h2>画像チェックはOpenAIのDecisions API<small>崩れた文字・個人情報・図の崩れを自動検品</small></h2>
    <p>ジェブはテキストのみなので、画像の判断が必要な場面では<b>OpenAIのDecisions API</b>を組み合わせている。画像生成で文字が崩れていたらダメ判定、スクリーンショットに個人情報が写っていたらモザイク処理、図鑑の矢印がうまく描けていなければ全然ダメと指摘──といった<b>見た目の品質チェック</b>をAIに任せている。</p>
    <div class="note"><div class="ic">🖼</div><div class="bubble2">画像生成を業務に組み込むと「微妙な崩れ」が量産されがち。検品もAIにやらせる二段構えにしておくと、最終成果物の品質が一気に安定する。</div></div>
  </div>

  <div class="card">
    <span class="num">06</span>
    <span class="badge b-gold">フック</span>
    <h2>「何かが起きたら」で発動するフックのルール<small>イベント駆動で判断AIと安全弁を自動起動</small></h2>
    <p>フックは<b>何かが起きたタイミングをトリガーに、決まった判断や操作を発動させる</b>仕組み。例えば「文章を書く場面では必ずジェブが起動する」「作業が完成したらObsidianにメモを登録する」「特定フォルダ内のファイルを削除しようとしたら強制的に止める」などのルールを組み込んでいる。</p>
    <ul>
      <li>文章を書くシーン → ジェブ（判断AI）を必ず起動</li>
      <li>完成したシーン → Obsidianへ自動メモ</li>
      <li>危険な操作 → 強制ストップの安全弁</li>
    </ul>
  </div>

  <div class="card">
    <span class="num">07</span>
    <span class="badge b-main">権限ルール</span>
    <h2>settings.jsonに「絶対ダメ」を書き込む<small>失敗は設定で二度と起こさせない</small></h2>
    <p>権限ルールは<b>settings.json</b>で細かく管理。<b>ファイル削除はNG</b>といった基本ルールに加え、過去にチャットワーク上のデータ削除でAIが悪さをした経験から<b>「チャットワーク上の削除は絶対ダメ」</b>というルールも登録済み。「2度とやらないでくれ、設定に入れといてくれ」と指示した内容が実際に設定ファイルに書かれているという、失敗から学ぶ運用だ。</p>
    <div class="bubble"><span class="who">運用のコツ</span><span class="txt">AIが一度やらかした操作は、その場で謝るだけでなく権限設定に落とし込む。同じ失敗が構造的に起きないようにするのがAIエージェントの正しい飼い慣らし方。</span></div>
  </div>

  <div class="card">
    <span class="num">08</span>
    <span class="badge b-gold">鍵管理</span>
    <h2>APIキーは1ファイルに集約し1Passwordでマスキング<small>漏れても平文では外に出ない設計</small></h2>
    <p>画像生成・動画生成など外部ツール用のAPIキーは<b>.envファイル1つに全部まとめて管理</b>。ただし並列で作業するAIに鍵を渡すため、そのままの文字列ではなく<b>1Passwordでデータマスキング</b>した文字列を保持する。APIキーの生文字列ではなく1Passwordの参照文字列なので、<b>外に漏れても実害が出ない</b>状態を作っている。</p>
    <div class="stats">
      <div class="s"><span class="v">.env</span><span class="l">APIキーを1ファイルに集約</span></div>
      <div class="s"><span class="v">1Password</span><span class="l">キーをマスキングして保管</span></div>
      <div class="s"><span class="v">漏洩対策</span><span class="l">平文では外部に出ない</span></div>
    </div>
  </div>

  <div class="card">
    <span class="num">09</span>
    <span class="badge b-main">全体ルール</span>
    <h2>CLAUDE.mdは「お願いベース」で書く<small>細かい手順ではなく方針を書いて記憶に参照させる</small></h2>
    <p>Claude Code全体のルールを書く<b>CLAUDE.md</b>は、お願いベースのルールを記述する場所。具体例として「毎回綺麗な日本語にしてね」「メモを取るシーンではObsidian CLIを使ってね」「ジェブで毎回判断するようにしてね」「AIっぽいデザイン禁止」などが書かれている。ルールの実体は記憶用メモ側に持たせ、<b>CLAUDE.mdからは参照させる</b>形で運用。完成物ができたら必ず見直すルールも入っている。</p>
  </div>

  <div class="card">
    <span class="num">10</span>
    <span class="badge b-gold">振り分け①</span>
    <h2>「他のAIに頼む」ルート ── CodexとAntigravity<small>できないことは素直に外注する構図</small></h2>
    <p>Claude Codeは画像生成ができないため、<b>画像生成はCodexのイメージ生成をプラグイン経由で接続</b>して依頼。動画生成とGoogle Workspace系タスクは<b>AntigravityにCLIで仕事を振る</b>。AntigravityがClaude Code並みに進化していたことに驚いたとのこと。レビューも外注先で、<b>文章量が多いもの・長い動画はコンテキストウィンドウが大きいGemini系（Antigravity）</b>、基本はCodexに見せている。</p>
    <ul>
      <li>画像生成 → Codexのイメージ生成スキル（プラグイン接続）</li>
      <li>動画生成・Google Workspaceタスク → Antigravity CLI</li>
      <li>成果物レビュー → 基本Codex、長大な内容はAntigravity</li>
    </ul>
  </div>

  <div class="card">
    <span class="num">11</span>
    <span class="badge b-main">振り分け②</span>
    <h2>大量の「エージェントスキル」を案件ごとに切り替え<small>小さいスキルを組み合わせて大きいタスクへ</small></h2>
    <p>2つ目の振り分け先は<b>自作のエージェントスキル</b>。動画のカット・テロップ入れ、図作成、サムネ・バナー・漫画制作、スライド作成、議事録レポート、ウェブサイト・ブログ更新、書籍制作、事務作業・お金関連、SNS系まで<b>大量にスキルを自作</b>。A社の登壇ではA社用スライドスキル、B社にはB社用と<b>案件ごとに使い分け</b>、デザインや著作権周りが被らないようにしている。小さいタスクごとのスキルを組み合わせて大きいタスクをこなすのが基本思想だ。</p>
    <div class="note"><div class="ic">🧩</div><div class="bubble2">スキルは自分で決めた名前で大量に登録され、案件（クライアント）別に切り替えて運用。コンテンツ内容は近くても、デザインと権利回りは一切被らせない設計。</div></div>
  </div>

  <div class="card">
    <span class="num">12</span>
    <span class="badge b-gold">振り分け③</span>
    <h2>MCP外部連携でGoogle・Slack・Figma・経理まで<small>コネクター経由なら直接指示するだけ</small></h2>
    <p>3つ目は<b>MCP・コネクター経由の外部サービス操作</b>。Google Workspace（Gmail・Googleドライブ・Googleカレンダー）はMCPで直接指示し、メールの仕訳やドライブ検索を実行。このほかSlack投稿、Discord管理、Notionページ作成、デザイン系は<b>Figmaでワイヤーフレームや図鑑作成</b>、お金の作業は<b>マネーフォワードで請求書作成・仕訳確認・資産表</b>をこなさせる。</p>
    <ul>
      <li>Google Workspace ── Gmail仕訳・ドライブ検索・カレンダー</li>
      <li>Figma ── ワイヤーフレームと図鑑作成</li>
      <li>マネーフォワード ── 請求書・仕訳・資産表を自動化</li>
    </ul>
  </div>

  <div class="card">
    <span class="num">13</span>
    <span class="badge b-main">振り分け④</span>
    <h2>外部APIルート ── 動画生成・音声・判断系<small>CLIにない機能はAPIキーで呼ぶ</small></h2>
    <p>MCPにもデスクトップアプリにもない機能は<b>外部API経由</b>で呼び出す。動画生成は<b>Seedance</b>をAPIで利用。音声は<b>ElevenLabsやGoogleのTTSモデル</b>でナレーションを合成。画像生成は基本Codex経由だが、<b>Codexの使用量が制限に達した時だけAPI経由に切り替え</b>。判断系のジェブとOpenAIのDecisions APIもAPIから呼んでおり、それぞれ呼び出し用スキルを用意している。</p>
    <div class="stats">
      <div class="s"><span class="v">Seedance</span><span class="l">API経由の動画生成</span></div>
      <div class="s"><span class="v">ElevenLabs</span><span class="l">TTSでナレーション合成</span></div>
      <div class="s"><span class="v">制限時切替</span><span class="l">Codex上限で画像APIへ</span></div>
    </div>
  </div>

  <div class="card">
    <span class="num">14</span>
    <span class="badge b-gold">ナレッジ</span>
    <h2>記憶は4階層 ── Claudeメモリー・Obsidian・ドライブ・デザインシステム<small>ナレッジを育てると精度が跳ね上がる</small></h2>
    <p>スキルの下に接続する<b>ナレッジ（記憶）層</b>が環境の核。①Claude Codeのメモリー機能に過去のやり取りが蓄積、②<b>Obsidianに「AIがAIのために書くメモ」</b>（日本語の禁じ手、スキルの使い方、メルマガ履歴、Xのネタ帳）を蓄積、③Googleドライブ内のコンテンツをナレッジとして参照、④<b>デザインシステムで雰囲気を固定</b>している。</p>
    <div class="bubble"><span class="who">デザインの秘密</span><span class="txt">KEITO chの資料がいつも青系でまとまっているのはデザインシステムのおかげ。案件・顧客別にシステムを分けて保有し、毎回同じクオリティ・同じデザインで吐き出させる。</span></div>
  </div>

  <div class="card">
    <span class="num">15</span>
    <span class="badge b-main">サブエージェント</span>
    <h2>スキルを呼ぶと小さいAIがポコポコ生まれる<small>並列処理と検品担当で品質を二重化</small></h2>
    <p>1つのClaude Codeが順番に作業すると遅く品質も落ちるため、<b>スキルごとにサブエージェントを用意し並列処理</b>させる。動画スキルなら<b>テロップを作る担当・クオリティを確認する担当・プランナー</b>に分業。スキルを1つ呼ぶと小さいAIが複数立ち上がり、それぞれの作業に集中しながらチェックを回す。「そういう仕組みで作って」とAIに伝えれば構築してくれる。</p>
    <div class="note"><div class="ic">👥</div><div class="bubble2">Codexへの振り分け時もサブエージェントが呼び出される。「作る担当」と「検品する担当」を分けることが、高品質を安定させるもう一つの柱。</div></div>
  </div>

  <div class="card">
    <span class="num">16</span>
    <span class="badge b-gold">道具の層</span>
    <h2>作業ごとに「何で動かすか」も与える<small>動画はRemotion・確認はPlaywright・資料はLibreOffice</small></h2>
    <p>各スキルには専用の道具を1つずつ紐づける。動画生成系は<b>Hyperframe、Remotion、FFmpeg</b>といったオープンソースの動画特化ツール。スライド確認はMacに入った<b>LibreOffice</b>をAIが勝手に導入して使用。ウェブサイトは<b>Playwright</b>やBrowser Useでブラウザを開いて確認、ブログ更新はCMS用MCP、X投稿はX APIと、<b>何をどこで使うか</b>まで環境側で整理済み。必要なツールの接続も「セットして使って」と言えばClaude Codeがやってくれる。</p>
  </div>

  <div class="card">
    <span class="num">17</span>
    <span class="badge b-main">出口と別入口</span>
    <h2>成果物はVercel・Cloudflareへ、別入口はGrokボット<small>X投稿は下書きリンクを人間が最終確認</small></h2>
    <p>出口も複数用意。レビュー結果は<b>指摘を返す</b>形で戻り、画像・動画はファイルとして出力。レポートは<b>Vercelにデプロイしパスワード付きでURL共有</b>、ブログ記事は独自ドメインサイトを<b>Cloudflare</b>に集約して反映。X投稿はClaude in ChromeかComputer Useでログインし<b>下書きまで作ってリンク通知、人間が確認して投稿</b>する。さらに別入口として<b>Grokボット</b>も用意──クラウドコンピューター上のClaude Code（本環境を丸ごとコピー）が1Passwordで安全にログインし、定期タスクの実行と完了確認を「人間の立場」で行う。チーム共有のDiscordでは「クロ」という名のボットが日次レポートを出す。</p>
  </div>

  <div class="card full">
    <span class="num">18</span>
    <span class="badge b-gold">まとめ</span>
    <h2>実例で見る運用フローと環境構築のすすめ<small>ブログ・広告動画・請求書の3パターン</small></h2>
    <p>最後に具体的なタスクでの流れを確認する。<b>ブログ記事</b>はフック発動→ジェブが依頼を分類→スキル選択→文字起こしから組立→検索→図作成→SEOタイトル→推敲→下書き→ジェブ判定→CMS接続で照合→問題あれば戻る→人間が最終確認。<b>広告動画</b>はモーションボード系スキルでデザイン指定→カード確認→ナレーション合成→1秒ごとの要素を絵に→音楽・画像生成→静止画検品→絵を重ねて動画化→検品→Geminiが完成品判定→ジェブの最終判断、と長いチェックフローを複数回挟むため1本20〜30分。<b>請求書</b>はマネーフォワードのスキルが選ばれ、.envからAPIキー取得→MCPで取引先検索→金額確認<b>ここだけ人間の確認を挟む</b>→PDF保存→報告。パズルのように環境を組み立て、あとはClaude Codeにお願いするだけで毎回同じクオリティの成果物が出る──これが「AIガチ勢」の環境設計だ。</p>
    <div class="flow">
      <div class="step"><b>入口</b>Claude Code一択。スマホ・ターミナル・Discord</div>
      <div class="step"><b>安全</b>ジェブ＋フック＋settings.json＋1Password</div>
      <div class="step"><b>振り分け</b>他AI・スキル・MCP・APIの4ルート</div>
      <div class="step"><b>品質</b>サブエージェント並列＋多重チェック</div>
    </div>
    <div class="note"><div class="ic">▶</div><div class="bubble2">AIエコシステムの図鑑（PDF）は概要欄の公式LINEから配布中。図をClaude Codeに見せて「こんな環境を作りたい」と伝えれば、構築手順を教えてくれる。</div></div>
  </div>
