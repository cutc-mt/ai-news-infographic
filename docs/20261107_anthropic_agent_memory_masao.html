<div class="wrap">

<header class="hero">
  <span class="tag">Anthropic × AIエージェントの記憶 ── 2026.11.07</span>
  <h1>AIエージェントはメモで賢くなるのか ── Anthropicが語る<span class="hl">記憶の4層構造</span>と<span class="hl">Dreaming</span></h1>
  <p>Anthropicが公式ブログで「AIエージェントの記憶」をテーマに、メモを持ち越して問題を解き続けるとクロードの正答率がどう変わるかを実験と数字で公開。記憶を「CLAUDE.md／memory.mdの先頭」「LLM-Wiki」「個別メモ」「作業の全記録」の4層に整理し、暇な時間に記録を読み返して記憶を整える「Dreaming」という概念も登場。記憶体系を掘り下げてきたまさお氏が独自の視点も交えて徹底解説する。</p>
  <div class="meta">
    <span>📺 <a href="https://www.youtube.com/watch?v=WXvjFeY8g6s">【重要知識】Anthropicの語るAIエージェントの記憶を徹底解説！DreamingやLLM-Wikiなど重要概念も登場！</a></span>
    <span>チャンネル: まさおAIじっくり解説ch (@ai_masaou)</span>
    <span>公開: 2026-11-07</span>
  </div>
  <div class="leadbox">
    <div class="icon">🧠</div>
    <div class="bubble">今回はAnthropicの公式ブログ記事を題材に、①記憶の4層構造 ②Dreamingとは何か ③メモの書き方の実験結果 ④LLM-Wikiの活用法、の4点を解説していくよ。「メモを持たせれば本当にエージェントは賢くなるのか」、数字とともに見ていこう。</div>
  </div>
</header>

<div class="grid">

  <div class="card">
    <span class="num">01</span>
    <span class="badge b-main">今日のテーマ</span>
    <h2>Anthropicが「AIエージェントの記憶」を公式ブログで解説<small>メモはエージェントを本当に賢くするのか</small></h2>
    <p>Anthropicが公開したのは、<b>クロードにメモを持ち越させたとき問題を解き続けられるか</b>、正答率が上がるのかを検証したブログ記事。概念整理としての<b>記憶の4層モデル</b>や、暇な時間に記憶を整え直す<b>ドリーミング（Dreaming）</b>という考え方まで、試行錯誤の過程が数字とともに共有されている。</p>
    <ul>
      <li>メモの持ち越しで正答率がどう変わるかを実験</li>
      <li>記憶を4層に分けた公式の概念整理が登場</li>
      <li>ドリーミングやLLM-Wikiなど重要概念が続々</li>
    </ul>
  </div>

  <div class="card">
    <span class="num">02</span>
    <span class="badge b-rose">概念整理</span>
    <h2>AIエージェントの記憶は「4層構造」で考える<small>ブラックボックスにせず、層を引いて整理</small></h2>
    <p>「AIエージェントの記憶」というと何でも詰め込まれたブラックボックスを想像しがちだが、この記事では<b>4つのレイヤー</b>に切り分けて定義。<b>どこに重みを置くべきか</b>の整理がしやすくなるため、層を引いておく価値は大きいという。</p>
    <div class="layer"><div class="ln">1</div><div class="lt"><b>CLAUDE.md／memory.mdの先頭</b>毎回セッションの頭で読み込まれる層</div></div>
    <div class="layer"><div class="ln">2</div><div class="lt"><b>LLM-Wiki</b>メモから組み立てたウィキ層</div></div>
    <div class="layer"><div class="ln">3</div><div class="lt"><b>個別メモ</b>memory.mdから段階的に参照される層</div></div>
    <div class="layer"><div class="ln">4</div><div class="lt"><b>作業の全記録</b>セッションログなど、残される生の記録</div></div>
  </div>

  <div class="card">
    <span class="num">03</span>
    <span class="badge b-main">層① セッション冒頭</span>
    <h2>毎回頭に入る「CLAUDE.md／memory.mdの先頭」<small>全記憶の入口であり、腐ると性能を下げる</small></h2>
    <p>1層目はセッション開始時に必ず読み込まれる<b>CLAUDE.mdやmemory.mdの先頭部分</b>。クロードコードではmemory.mdの先頭<b>200行</b>が毎回自動で読み込まれる。ここが古い情報や誤りで腐ってしまうとモデルを惑わし、ミスの原因になるため、<b>鮮度の維持が最重要</b>の層だ。</p>
    <div class="bubble"><span class="who">運用のコツ</span><span class="txt">まさお氏は管理しにくいmemory.mdをオフにし、CLAUDE.mdから「デザインはこのWikiを見て」「デプロイ手順はここを見て」と参照を貼る運用にしているそう。</span></div>
  </div>

  <div class="card">
    <span class="num">04</span>
    <span class="badge b-rose">層② LLM-Wiki</span>
    <h2>メモから組み立てる「LLM-Wiki」層<small>アンドレ・カルパシー氏の提唱でも話題</small></h2>
    <p>2層目はメモをまとめて構築する<b>ウィキ層</b>。自分で作る記憶アプリやWikiリポジトリをイメージするとよく、memory.mdやセッションログを参照しながら情報を体系的にまとめたもの。アンドレ・カルパシー氏の<b>LLM-Wiki</b>の考え方とも呼応し、今回Anthropic自身が公式に「Wiki」という概念を登場させたのが大きなニュースだ。</p>
    <ul>
      <li>散らばったメモ・ログを参照して構築する知識層</li>
      <li>カルパシー氏のLLM-Wikiと親和性が高い</li>
      <li>クロードはWikiの参照が非常に上手い</li>
    </ul>
  </div>

  <div class="card">
    <span class="num">05</span>
    <span class="badge b-main">層③ 個別メモ</span>
    <h2>memory.mdが参照する「個別メモ」層<small>段階的開示でコンテキストを節約</small></h2>
    <p>3層目はmemory.mdから<b>段階的に参照される個別のメモ</b>。先頭層にすべて書くと先が読まれないため、「詳しくはこのファイルを見てください」という<b>参照の形</b>で辿らせる。DocsやNotesなど、エージェントに各所でマークダウンを書かせている人にも馴染みのある層だ。</p>
    <div class="bubble"><span class="who">ここがポイント</span><span class="txt">「段階的開示」＝いつも読む冒頭200行は小さく保ち、詳細は必要なときだけ参照先を辿らせる設計。コンテキストの節約と鮮度管理を両立する柱になる。</span></div>
  </div>

  <div class="card">
    <span class="num">06</span>
    <span class="badge b-rose">層④ 全記録</span>
    <h2>生の証拠が残る「作業の全記録」層<small>セッションログが記憶整備の原材料</small></h2>
    <p>4層目は<b>セッションログなどの作業の全記録</b>。クロードコードをローカルで使っていれば、作業のログがそのまま手元に残っているはずだ。この層はそれ自体は「読ませる」ものではなく、<b>ドリーミングの原材料</b>として上の層へ蒸留していくための記録という位置づけだ。</p>
    <div class="note"><div class="ic">📎</div><div class="bubble2">4層の流れは「全記録 → 個別メモ → Wiki → 先頭層」へと徐々に上のレイヤーへ持ち上げていくイメージ。重みの配分を考えるうえで、この縦の流れを掴むのが最初の一歩。</div></div>
  </div>

  <div class="card">
    <span class="num">07</span>
    <span class="badge b-main">Dreamingとは</span>
    <h2>暇な時間に記憶を読み返して整える「Dreaming」<small>人間の睡眠中の記憶の固め化がモデル</small></h2>
    <p>注目の概念<b>ドリーミング</b>は、エージェントの暇な時間に<b>作業の全記録を読み返して記憶を修正・構築する工程</b>のこと。人間が寝ている間に会話や経験を素早く取り込んで長期記憶へ固める仕組みに影響を受けた考え方で、名前もそこから来ているとみられる。</p>
    <ul>
      <li>暇な時間（アイドル時間）を記憶整備に使う</li>
      <li>人間の睡眠による記憶の固め化が元ネタ</li>
      <li>まだ知らない人・導入していない人は要チェック</li>
    </ul>
  </div>

  <div class="card">
    <span class="num">08</span>
    <span class="badge b-rose">Dreamingの内容</span>
    <h2>ドリーミング中に行われる4つの作業<small>メモ修正・新規作成・Wiki構成・冒頭の調整</small></h2>
    <p>ドリーミングでは、全記録と既存メモを見比べながら次の処理を行う。具体例としては<b>週に1回夜に</b>、クロードコードの過去ログとmemory.mdを見比べさせて、よく参照するCLAUDE.mdやmemory.mdを改善するといった運用が挙げられる。</p>
    <div class="flow">
      <div class="step"><b>修正</b>誤ったメモの記憶を直す</div>
      <div class="step"><b>追加</b>新しいメモを作成する</div>
      <div class="step"><b>構成</b>Wikiを組み立て直す</div>
      <div class="step"><b>調整</b>冒頭層の中身を整える</div>
    </div>
  </div>

  <div class="card">
    <span class="num">09</span>
    <span class="badge b-main">実例</span>
    <h2>ポケモン実験で見えた誤記憶の修正<small>ポケモンセンターの位置を間違えて記録</small></h2>
    <p>ポケモン赤の実験で、クロードは<b>ポケモンセンターの位置を誤って記録</b>し、入口の一方通行の段差（罠）を無視して「済んだこと」とメモしてしまったため、元のルートへ落ちてしまう事態が発生。ところがドリーミングを行うと、<b>入口で引き返す</b>正しい記憶へ修正できたという。</p>
    <div class="bubble"><span class="who">教訓</span><span class="txt">全記録と誤ったメモを突き合わせて直したメモを構成し直す。この工程を挟むだけで、タスクの成功率が変わってくる。</span></div>
  </div>

  <div class="card">
    <span class="num">10</span>
    <span class="badge b-rose">ベンチマーク</span>
    <h2>メモの持ち越しで正答率アップ ── CLベンチ1.0の結果<small>オパス5世代で「学習ループ」が閉じ1000超え</small></h2>
    <p>メモだけを持ち越して問題を解き続けるCLベンチ1.0の検証では、Opus 4.7で正答率が大幅に伸び、その後も徐々に上昇。<b>Opus 5あたりから「仮説をメモして確かめて次に使う」という学習ループが閉じ</b>、スコアは<b>1000超え</b>を達成。Opus 5.5やSonnet 5.5もループを閉じ、記憶ありで高水準を維持した。</p>
    <div class="stats">
      <div class="s"><span class="v">Opus 4.7</span><span class="l">正答率が大幅に伸びた世代</span></div>
      <div class="s"><span class="v">1000超え</span><span class="l">学習ループ閉鎖後のスコア</span></div>
      <div class="s"><span class="v">5.5世代</span><span class="l">Opus／Sonnetとも高水準</span></div>
    </div>
  </div>

  <div class="card">
    <span class="num">11</span>
    <span class="badge b-main">実験の発見</span>
    <h2>「失敗だけ記録せよ」は逆効果だった<small>細かいルールは返って邪魔になる</small></h2>
    <p>実験中、記憶の仕方を<b>「失敗だけを記録する」形に制約</b>したところ、良い結果にならなかった。<b>細かいルールは返って邪魔になる</b>という実験結果だ。運用に当てはめると、CLAUDE.mdには<b>「何のための記憶か（Why）」は書くが、使い方の手順（How）は縛らない</b>のが重要になる。</p>
    <div class="note"><div class="ic">💡</div><div class="bubble2">まさお氏がCLAUDE.mdの書き方解説で「ファイルやフォルダの形は指定するけど手順は縛らない」と案内してきた背景にも、この実験結果がつながっているとのこと。</div></div>
  </div>

  <div class="card">
    <span class="num">12</span>
    <span class="badge b-rose">ポケモン実験</span>
    <h2>メモの「量」より「質」── 世代を追う進化<small>ソネット3.7の1個 → オパス5.5でクリア</small></h2>
    <p>ポケモン攻略実験では、Sonnet 3.7は膨大なメモの整理に追われてゲーム操作の手順が複雑化し、<b>バッジ1個</b>が限界だった。メモの量を大幅に絞ったFable 5は<b>バッジ4個</b>まで到達。さらにOpus 5.5は<b>「目標と次の一手」を追う小さなフォルダを書き換え続ける</b>方法でゲームをクリアした。メモが22倍多くてもゲームは先に進まない。</p>
    <ul>
      <li>Sonnet 3.7 ── メモ過多で整理に追われバッジ1個</li>
      <li>Fable 5 ── メモを絞りバッジ4個</li>
      <li>Opus 5.5 ── 小さな目標フォルダの書き換えでクリア</li>
    </ul>
  </div>

  <div class="card">
    <span class="num">13</span>
    <span class="badge b-main">書き方の指針</span>
    <h2>メモに残すべきもの・残さないもの<small>「判断・失敗からの学び・戦略」を残す</small></h2>
    <p>各種実験の学びから、memory.mdに構成すべきは<b>判断の基準、失敗から分かったこと、戦略・計画・ルール</b>。一方でREADMEや設定ファイルを見れば分かる事実は書かない。<b>クロードのモデルが賢い前提</b>で、当たり前のことを書かず、頭に入れておくべき判断材料だけを残すのが筋だ。</p>
    <div class="bubble"><span class="who">覚えておきたい</span><span class="txt">「何のための記憶か」を書き、判断・失敗からの学び・計画を残す。手順の縛りと自明な事実は書かない──これが実験に裏付けられた指針。</span></div>
  </div>

  <div class="card">
    <span class="num">14</span>
    <span class="badge b-rose">Wikiの威力</span>
    <h2>35万ファイル・4.2億トークンからWikiを構築<small>導入だけでクイズ正答率が向上</small></h2>
    <p>クロードが買収した会社の実例として、<b>約35万ファイル・4.2億トークン分</b>のドキュメントからWikiを構築。Wikiを導入しただけで<b>クイズの出題に対する正答率が上がった</b>という。また<b>「Wiki＋検索」の併用</b>は検索のみと比べ、複数の文章を横断しないと答えられない質問で強みを発揮した。</p>
    <div class="stats">
      <div class="s"><span class="v">35万</span><span class="l">Wiki化したファイル数</span></div>
      <div class="s"><span class="v">4.2億</span><span class="l">対象トークン数</span></div>
      <div class="s"><span class="v">Wiki＋検索</span><span class="l">複数文書の質問に強い</span></div>
    </div>
  </div>

  <div class="card">
    <span class="num">15</span>
    <span class="badge b-main">Wikiの落とし穴</span>
    <h2>書き方を誤るとWikiは腐る<small>膨張・事実の消失・古い情報の残留</small></h2>
    <p>強力なWikiにも弱点がある。書き方を誤ると<b>無駄な情報が膨らむ、事実が消える、古い情報がそのまま残る</b>といった問題が起きる。対策としては<b>リンク構造</b>を活かし、元の情報と紐づけたスマートな分割を意識すること。各自が向き合って育てていく必要がある。</p>
    <ul>
      <li>無駄な情報の膨張に注意</li>
      <li>事実の消失・古い情報の残留を防ぐ</li>
      <li>リンク構造と賢い分割で対処する</li>
    </ul>
  </div>

  <div class="card">
    <span class="num">16</span>
    <span class="badge b-rose">運用テクニック</span>
    <h2>複数エージェントなら「1エージェント1ページ」に分ける<small>memory.mdの共闘書き込みは事実を取りこぼす</small></h2>
    <p>1つのmemory.mdにエージェントが複数で書き込むと、<b>拾ってほしい事実が拾われない</b>ことがあった。そこで<b>例えばnotes/各エージェント名.mdのように1ページを1エージェントに割り当て</b>、それらをmemory.mdからまとめて引っ張る形式にしたところ、欲しい事実をちゃんと残せるようになったという。</p>
    <div class="bubble"><span class="who">構成例</span><span class="txt">memory.md（先頭200行）→ エージェント別ページ → Wiki → セッションログ。段階的開示と1エージェント1ページを組み合わせると取りこぼしが減る。</span></div>
  </div>

  <div class="card">
    <span class="num">17</span>
    <span class="badge b-main">残された課題</span>
    <h2>ドリーミングの答えはまだ出ていない<small>実行タイミング・鮮度・コスト・価格は未公開</small></h2>
    <p>記事を読んでも、<b>ドリーミングをいつ走らせるのか</b>、<b>ずれた記憶の鮮度をどう保つのか</b>、そして<b>コスト問題</b>への完全な答えは示されていない。ドリーミング自体の価格や提供時期についても書かれておらず、現時点では方向性と兆候が示された段階。学ぶことはまだ多いテーマだ。</p>
    <ul>
      <li>ドリーミングの実行タイミングは各自の設計次第</li>
      <li>記憶の鮮度管理とコストの両立は今後の課題</li>
      <li>公式な価格・提供時期は記事時点で未記載</li>
    </ul>
  </div>

  <div class="card full">
    <span class="num">18</span>
    <span class="badge b-rose">まとめ</span>
    <h2>記憶の4層＋ドリーミングで、エージェントは「賢く」なる<small>Whyを書きHowを縛らないメモがカギ</small></h2>
    <p>Anthropicの記事は、①記憶を「先頭層・LLM-Wiki・個別メモ・全記録」の4層で整理する公式の概念整理、②暇な時間に全記録から記憶を整え直すドリーミングという概念の提示、③メモの持ち越しで正答率が上がるという実験結果（Opus 5世代で学習ループが閉じ1000超え）、④Wiki＋検索の強さ、という4つの収穫を含む濃い内容だった。「失敗だけ記録」の制約は逆効果、メモは量より質、複数エージェントは1ページ1エージェント──運用に直結する知見も豊富で、エージェント構築者は押さえておくべき一本と言える。</p>
    <div class="flow">
      <div class="step"><b>概念</b>記憶の4層構造で重みを整理する</div>
      <div class="step"><b>整備</b>ドリーミングで記憶の鮮度を保つ</div>
      <div class="step"><b>指針</b>Whyを書き、Howは縛らない</div>
      <div class="step"><b>拡張</b>Wiki＋検索で横断質問に強く</div>
    </div>
