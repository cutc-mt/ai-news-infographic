<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>15秒動画を作り直さず会話で直す Gemini Omni 1.2 Flash | ずんめたラボ【今知っておきたいAI】">
<link href="https://fonts.googleapis.com/css2?family=Yomogi&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#23101E;
    --panel:#2E1727;
    --panel2:#3B1F32;
    --line:#5C3450;
    --ink:#FBEFF5;
    --sub:#C9A3B5;
    --main:#FF7A6B;
    --main-deep:#FFB3A8;
    --main-soft:rgba(255,122,107,.12);
    --gold:#FFD08A;
    --gold-soft:rgba(255,208,138,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Noto Sans JP",Meiryo,sans-serif;line-height:1.8}
  .wrap{max-width:1080px;margin:0 auto;padding:24px 16px 64px}
  header.hero{background:linear-gradient(150deg,#2E1727 0%,#341A2B 55%,#3E1430 100%);border:1px solid var(--line);border-radius:20px;padding:36px 28px;margin-bottom:28px;position:relative;overflow:hidden}
  header.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,122,107,.18),transparent 70%)}
  .hero .tag{display:inline-block;background:var(--main-soft);color:var(--main);border:1px solid rgba(255,122,107,.45);font-size:12px;font-weight:700;letter-spacing:.12em;padding:4px 14px;border-radius:999px;margin-bottom:14px}
  .hero h1{font-size:clamp(20px,3.4vw,30px);line-height:1.45;margin-bottom:12px;color:var(--ink)}
  .hero h1 .hl{color:var(--gold)}
  .hero p{color:var(--sub);font-size:14px;max-width:820px}
  .hero .meta{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--sub)}
  .hero .meta span{background:rgba(251,239,245,.05);border:1px solid var(--line);padding:3px 12px;border-radius:999px}
  .hero .meta a{color:var(--main);text-decoration:none}
  .leadbox{margin-top:20px;background:var(--gold-soft);border:1px solid rgba(255,208,138,.4);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
  .leadbox .icon{flex-shrink:0;width:44px;height:44px;border-radius:12px;background:var(--gold);color:#23101E;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
  .leadbox .bubble{font-size:13.5px;color:var(--main-deep);font-family:'Yomogi',cursive;line-height:1.9}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 18px;position:relative;box-shadow:0 2px 10px rgba(0,0,0,.35)}
  .card.full{grid-column:1/-1}
  .card h2{font-size:16.5px;margin-bottom:4px;line-height:1.5;color:var(--main)}
  .card h2 small{display:block;font-size:11.5px;color:var(--sub);font-weight:600;letter-spacing:.04em;margin-top:2px}
  .badge{display:inline-block;font-size:12.5px;font-weight:800;padding:3px 14px;border-radius:10px;letter-spacing:.04em;margin:8px 0 10px}
  .b-main{background:var(--main-soft);color:var(--main);border:1px solid rgba(255,122,107,.4)}
  .b-gold{background:var(--gold-soft);color:var(--gold);border:1px solid rgba(255,208,138,.35)}
  .card p{font-size:13.5px;color:var(--ink);margin-bottom:8px}
  .card ul{margin:6px 0 10px 18px;font-size:13.5px}
  .card li{margin-bottom:4px}
  .card b{color:var(--main-deep)}
  .card .num{position:absolute;top:14px;right:16px;font-size:12px;font-weight:800;color:var(--sub);letter-spacing:.08em}
  .bubble{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0;font-size:13px;line-height:1.9}
  .bubble .who{display:inline-block;font-size:11.5px;font-weight:800;color:var(--gold);margin-right:8px;letter-spacing:.05em}
  .bubble .txt{font-family:'Yomogi',cursive;color:var(--ink)}
  .note{display:flex;gap:10px;align-items:flex-start;margin-top:12px;background:var(--gold-soft);border:1px solid rgba(255,208,138,.35);border-radius:12px;padding:10px 12px}
  .note .ic{flex-shrink:0;width:34px;height:34px;border-radius:10px;background:var(--gold);color:#23101E;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
  .note .bubble2{font-size:12.5px;color:#FFE6C2;font-family:'Yomogi',cursive;line-height:1.85}
  .stats{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
  .stats .s{flex:1 1 150px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
  .stats .s .v{font-size:20px;font-weight:800;color:var(--gold)}
  .stats .s .l{font-size:11.5px;color:var(--sub);margin-top:2px}
  .flow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin:10px 0}
  .flow .step{flex:1 1 140px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px}
  .flow .step b{display:block;color:var(--main);font-size:12px;margin-bottom:2px}
  .rank li{display:flex;gap:10px;align-items:baseline;margin-bottom:6px}
  .rank .r{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--main-soft);border:1px solid rgba(255,122,107,.4);color:var(--main);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
  .rank .t{font-family:'Yomogi',cursive;font-size:13.5px}
  footer.end{margin-top:28px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 20px;text-align:center}
  footer.end p{font-size:13px;color:var(--sub)}
  footer.end a{color:var(--main);font-weight:700}
  @media(max-width:760px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">

<header class="hero">
  <span class="tag">動画生成AI × 会話で編集 ── 2026.11.07</span>
  <h1>15秒の動画を<span class="hl">作り直さず会話で直す</span> ── Google「<span class="hl">Gemini Omni 1.2 Flash</span>」</h1>
  <p>2026年11月、Googleは動画生成AI「Gemini Omni 1.2 Flash」を公開。生成できる動画が最大10秒から最大15秒に伸び、さらに一度作った15秒の動画の一部を、最初から作り直すことなく会話形式の指示で直せるようになりました。ずんめたラボが「何が変わったか」「そこだけ直せるか」「見た目は最後まで保てるか」「AI作成と分かるか」「どこで使えていくらか」の4つの疑問に答えながら、背景だけを4回入れ替える実例や、下書きを作ってから仕上げる安い進め方まで解説します。</p>
  <div class="meta">
    <span>📺 <a href="https://www.youtube.com/watch?v=sniivilrVpc">Gemini Omni 1.2 Flashで15秒の動画 作り直さず会話で直す｜今知っておきたいAI</a></span>
    <span>チャンネル: ずんめたラボ (@zunmeta_lab_ch)</span>
    <span>公開: 2026-11-07</span>
  </div>
  <div class="leadbox">
    <div class="icon">🎬</div>
    <div class="bubble">ずんめ「僕も持ち帰りのお店の広告を作りたいのだ」── 今回の主役は15秒の動画と「会話で直す」ワークフロー。お店の広告を作りながら、①最大15秒になった ②そこだけ会話で直す ③下書きから試す、の3つを持ち帰ります。</div>
  </div>
</header>

<div class="grid">

  <div class="card">
    <span class="num">01</span>
    <span class="badge b-main">今日のテーマ</span>
    <h2>15秒作れて、後から会話で直せる動画生成AI<small>Googleの動画生成AI「Gemini Omni 1.2 Flash」</small></h2>
    <p>Gemini Omni 1.2 Flashは、Googleの動画を作るAIの新しいバージョン。名前に「Flash」とつくことからも分かる通り<b>速さを重視したモデル</b>で、今回の目玉は<b>最大15秒の動画が作れる</b>ようになったことと、<b>作った動画を最初から作り直さず、会話で一部分ずつ直せる</b>ようになったことの2点だ。</p>
    <ul>
      <li>15秒あればお店の広告が1本作れる（お店の名前もしっかり言える）</li>
      <li>できた後で「背景を変えたい」になっても作り直し不要</li>
      <li>何が変わったか／直せるか／見た目が保てるか／分かるか／使えるかを順に確認</li>
    </ul>
  </div>

  <div class="card">
    <span class="num">02</span>
    <span class="badge b-gold">何が変わったか</span>
    <h2>最大10秒 → 最大15秒へ、1秒刻みで長さを選択<small>前バージョン1.1との違い</small></h2>
    <p>前のバージョン「1.1 Flash」で作れた動画は<b>最大10秒</b>だった。今回の「1.2 Flash」では<b>最大15秒まで伸び、3〜15秒の間を1秒刻みで長さを選べる</b>ようになった。お店の広告なら迷わず15秒にするのがおすすめと紹介されている。</p>
    <div class="stats">
      <div class="s"><span class="v">15秒</span><span class="l">最大生成時間（1.2）</span></div>
      <div class="s"><span class="v">10秒</span><span class="l">最大生成時間（1.1）</span></div>
      <div class="s"><span class="v">1秒刻み</span><span class="l">3〜15秒で長さ指定</span></div>
    </div>
  </div>

  <div class="card">
    <span class="num">03</span>
    <span class="badge b-main">見本への忠実さ</span>
    <h2>同じ見本・同じ指示でも出来が変わる<small>1.1と1.2を並べた公式比較</small></h2>
    <p>「見本」とは、AIに渡すお手本の絵のこと。同じ見本と同じ頼み方で2つのバージョンを作った映像では、<b>左が見本、真ん中が1.1、右が1.2</b> と並べてガラスの文字の模様が比較された。結果、<b>1.2の方が見本と同じ模様に近く、1.1は見本の絵にそこまで似ていない</b>と発表されている。</p>
    <div class="bubble"><span class="who">チェックポイント</span><span class="txt">キャラや商品の見本を渡して作るとき、1.2はお手本に寄ってくる。ブランドイメージを保ちたい動画向き。</span></div>
  </div>

  <div class="card">
    <span class="num">04</span>
    <span class="badge b-gold">映像の質</span>
    <h2>切れ目のないワンカットと、映画のようなカメラワーク<small>Google公式映像で確認</small></h2>
    <p>Google公式の映像では、<b>浜辺に膝をつく人から一気に引いて空まで上がり、島が見える</b>ショットが披露された。この映像は<b>途中で一度も場面が切り替わっていない、切れ目のない1つの場面のワンカット</b>。急に別の場面へ飛ぶことが大きく減り、「一気に引く」「回り込む」といった動きも文章で頼めるようになった。</p>
    <div class="note"><div class="ic">🎥</div><div class="bubble2">文章を打つだけで映画のような映像が作れるように。発表には「作るだけでなく直すのも15秒までできる」とも書かれている。</div></div>
  </div>

  <div class="card">
    <span class="num">05</span>
    <span class="badge b-main">「直す」とは</span>
    <h2>作った動画の一部だけを、後から変えること<small>最初から作り直す必要がない</small></h2>
    <p>発表にある「直せる」の意味は、<b>作った動画の一部だけを後から変えられる</b>ということ。背景を変えたくなっても、最初から作り直す必要がなく、会話形式で「ここをこうして」と指示を重ねていける。これが本動画の中心テーマで、1.2では<b>15秒の全体を会話で直せる</b>ようになった（前バージョンでも会話で直すこと自体は可能だった）。</p>
    <div class="bubble"><span class="who">ずんめ</span><span class="txt">背景を変えたいのに最初から作り直すと、人の動きまでもう1度作り直しになるのだ。会話で直せば直すのはそこだけなのだ。</span></div>
  </div>

  <div class="card">
    <span class="num">06</span>
    <span class="badge b-gold">活用例① 解説動画</span>
    <h2>15秒あれば、こんな解説映像も作れる<small>日本語の綴りも正しく出る</small></h2>
    <p>紹介された実例では、<b>日本語の絵1枚を添えて、蜂の巣を4カットで解説する映像</b>を作成。巣の中に入っていくと、働きバチに丸い印がつき、卵や虫、サギにも<b>名前の札</b>がついている。普段の英語の綴りも正しく出ているそうで、<b>理科の授業で使えそう</b>とのこと。</p>
    <ul>
      <li>絵1枚＋4カットで構成される短い解説動画</li>
      <li>ラベルの日本語・英語の表記が正確</li>
      <li>教材のような「説明する動画」にも15秒で対応</li>
    </ul>
  </div>

  <div class="card">
    <span class="num">07</span>
    <span class="badge b-main">活用例② 背景だけ変更</span>
    <h2>騎士と女王の動画で、背景を続けて4回変更<small>2人の動き・演技・鎧の光り方はそのまま</small></h2>
    <p>公式の騎士と女王の動画に「背景を森に変えて」と頼むと、<b>後ろだけが森になった</b>。続けて白い馬のいる場所へ、さらに時計石の後ろへと、<b>全部で4回背景を変えた</b>。それでも2人の動きはどれも同じで、<b>演技も鎧の光り方もそのまま残る</b>と発表された。</p>
    <div class="flow">
      <div class="step"><b>1回目</b>元の動画に「背景を森に」と指示</div>
      <div class="step"><b>2〜4回目</b>白い馬の場所・時計石の後ろなどへ変更</div>
      <div class="step"><b>結果</b>人物の動き・演技・光り方は変わらず</div>
    </div>
  </div>

  <div class="card">
    <span class="num">08</span>
    <span class="badge b-gold">会話で直せるもの</span>
    <h2>商品・背景・照明と天気・画面の縦横を入れ替え<small>人の演技は直してもそのまま</small></h2>
    <p>会話で直せる対象を発表から並べると、まず<b>入れ替えるもの</b>として商品と背景。映っている商品だけを別の商品にできる。次に<b>照明と天気</b>では、晴れの映像を雨にできる。<b>画面の縦横</b>も横長から縦長に変えられ、公式映像では人の演技は直してもそのまま残っていた。</p>
    <ul>
      <li><b>商品</b> ── 映っている商品だけを別の商品に</li>
      <li><b>背景</b> ── 後ろの風景だけ差し替え</li>
      <li><b>照明・天気</b> ── 晴れを雨になど雰囲気を変更</li>
      <li><b>縦横</b> ── 横長を縦長に。同じ動画から載せ先に合わせた広告を作れる</li>
    </ul>
  </div>

  <div class="card">
    <span class="num">09</span>
    <span class="badge b-main">会話で直す② 被写体の入れ替え</span>
    <h2>タコの動きを、ダンサーにそのまま移す<small>1回目の動画を作り直さずに仕上げ</small></h2>
    <p>まず<b>タコがゆらゆら動く動画</b>を作り、そこへ<b>ダンサーの写真を渡して「入れ替えて」と頼む</b>と、タコと同じ動きでドレスが揺れる映像になった。タコの動きをそのままダンサーへ移せるのだ。さらに<b>2回目の頼みで仕上げだけを入れ替え</b>た際も、<b>1回目の動画を作り直さずに使っている</b>。動きはそのままで形だけが変わる。</p>
    <div class="bubble"><span class="who">ここが便利</span><span class="txt">「下地の動画を作る → 写真で被写体を差し替える → 仕上げを変える」と積み上げられる。1から作り直すロスがない。</span></div>
  </div>

  <div class="card">
    <span class="num">10</span>
    <span class="badge b-gold">安く仕上げる流れ</span>
    <h2>粗い画質で下書き → 会話で直す → 気に入ったら高画質<small>公式も進めるコストを抑える進め方</small></h2>
    <p>画質とは画面の細かさで、数字が大きいほど細かい。公式は<b>安く仕上げる進め方</b>として、まず<b>360pや720pの粗い画質で下書き</b>を作り、素早く試すことを進めている。気になるところは会話でそこだけ直し、<b>全部を作り直さないからその分安く済む</b>。最後に気に入ったものだけ1080pや4Kに上げる。</p>
    <div class="flow">
      <div class="step"><b>STEP 1</b>360p/720pで下書きを素早く作る</div>
      <div class="step"><b>STEP 2</b>会話で気になる箇所だけ直す</div>
      <div class="step"><b>STEP 3</b>気に入ったものだけ1080p/4Kへ</div>
    </div>
  </div>

  <div class="card">
    <span class="num">11</span>
    <span class="badge b-main">見た目の一貫性</span>
    <h2>15秒の最後まで、同じ人に見えるのか<small>服の着替え検証 ── 背中の形まで一致</small></h2>
    <p>SNSのXでも「15秒の最後まで同じ人に見えるか」という声があった。公式映像の服の着替え検証では、<b>女性の写真1枚と服3着の前と後ろの写真</b>を渡した。ポロシャツから緑のドレスに変わっても、<b>回って後ろを向くと背中の形まで同じ</b>。青い上着の背中の鳥の絵もそのままだった。<b>顔や服はカメラの角度が変わっても保たれる</b>と発表され、服の通販や商品が回る映像に向くとされている。</p>
    <div class="note"><div class="ic">👗</div><div class="bubble2">ただしこれは公式映像での例で、いつもこうなるとは限らない。試着映像を作るときは自分でも確認を。</div></div>
  </div>

  <div class="card">
    <span class="num">12</span>
    <span class="badge b-gold">見本にできるもの</span>
    <h2>渡せる見本は3つ ── 画像・短い動画・声<small>声の見本で話す人を分けられるように</small></h2>
    <p>見本として渡せるものは3つある。1つ目は<b>画像</b>（キャラ・商品・画風の見本。渡せばその姿で出てくるが、全く同じになるとは限らない）。2つ目は<b>3秒までの短い動画</b>（こう動いてほしいという手本）。3つ目は<b>声などの音の手がかり</b>で、音質の絵と4つのキャラの絵に1秒ずつの声を渡した例では、<b>それぞれの声が合うキャラの口から出て、口の動きも前よりはっきり合う</b>ようになった。みんなで話すアニメが作れてしまう。</p>
    <ul>
      <li><b>画像</b> ── キャラ・商品・画風の見本</li>
      <li><b>動画（3秒まで）</b> ── 動きの手本</li>
      <li><b>声</b> ── 声の見本で話す人を分けられる＋リップシンク向上</li>
    </ul>
  </div>

  <div class="card">
    <span class="num">13</span>
    <span class="badge b-main">苦手なこと</span>
    <h2>Google自身が認める、まだ苦手な3つ<small>改善は続けていると発表</small></h2>
    <p>Googleはまだ苦手なことも3つあげている。得意なところと苦手なところを知っておくことが、このAIを活かすコツだ。</p>
    <ul class="rank">
      <li><span class="r">1</span><span class="t">スポーツのような速い動き</span></li>
      <li><span class="r">2</span><span class="t">話の流れが急に変わる場面 ── 急な展開の多いアニメはまだ難しい</span></li>
      <li><span class="r">3</span><span class="t">複雑な物理 ── 物がぶつかる・水が跳ねるなどの動き</span></li>
    </ul>
    <p>Xでは「アニメの素材は今ひとつ」という感想もあれば、<b>「日本語の表現はしっかり出た」</b>という感想もあった。</p>
  </div>

  <div class="card">
    <span class="num">14</span>
