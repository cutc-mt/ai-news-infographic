  .note .bubble2{font-size:12.5px;color:#8A4A22;font-family:'Yomogi',cursive;line-height:1.85}

<body>
<div class="wrap">

<header class="hero">
  <span class="tag">Meta Muse 新機能「スペース」 ── 2026.11.07</span>
  <h1>テキストのままでは読みにくい情報を<span class="hl">まるごとアプリ化</span> ── Museスペース機能の実操作を解説</h1>
  <p>Meta Museに追加された「スペース」は、アプリを簡単に作ったり、チャットのテキストで見にくい進捗情報や記録をウェブサイトのように見やすく表示したりできる機能。本動画では、提案から作成する方法・自作AIキャラとの小説共同制作の実例・動画生成アプリとスライド生成アプリの2本の実演、そしてサイドチャットやスキルとの使い分けまで、実際の画面操作で徹底解説する。</p>
  <div class="meta">
    <span>📺 <a href="https://www.youtube.com/watch?v=M9M1lgk3cao">【超便利】Meta Museのスペース機能でアプリを生成！作り方を徹底解説！</a></span>
    <span>チャンネル: AI共創イノベーション (@AICoCreation)</span>
    <span>公開: 2026-11-07</span>
  </div>
  <div class="leadbox">
    <div class="icon">🚀</div>
    <div class="bubble">今回はMeta Museの新機能「スペース」をご紹介するよ。①スペースの基本と作り方 ②小説や進捗管理のまとめサイト実例 ③動画生成・スライド生成アプリの実演 ④サイドチャット・スキルとの使い分け、の順番で見ていこう。</div>
  </div>
</header>

<div class="grid">

  <div class="card">
    <span class="num">01</span>
    <span class="badge b-main">今日のテーマ</span>
    <h2>Museに「スペース」が追加 ── 何ができる機能？<small>アプリ生成と、見にくい情報のサイト化の2つの使い方</small></h2>
    <p>Meta Museのスペースは、<b>アプリを簡単に作れる</b>機能であり、同時に<b>テキストでは読みにくい情報をウェブサイトのような見やすい形で表示する</b>機能でもある。作ったものはまとめサイトを見る感覚で眺められ、繰り返し使う作業ならそのままボタン操作できるアプリに育てられる。</p>
    <ul>
      <li>用途に合わせたアプリを会話だけで生成</li>
      <li>進捗や記録を一目で分かるページに整理</li>
      <li>イラストや図を入れて楽しげな見た目にできる</li>
    </ul>
  </div>

  <div class="card">
    <span class="num">02</span>
    <span class="badge b-acc">基本概念</span>
    <h2>スペースとは「目的ごとの作業場所」<small>毎回ゼロから説明しなくて済むようになる</small></h2>
    <p>使い方が分からなければ、まずMuse（やChatGPT）自身に聞いてみるのが早い。スペースは<b>目的ごとに作業場所を分けて、資料や指示をまとめておける場所</b>。ChatGPTに活用例を聞くと、旅行プランナーやポッドキャスト制作スタジオ、クライアント管理などの使い方が挙がった。</p>
    <div class="bubble"><span class="who">確認</span><span class="txt">スペースは資料・指示の置き場。一度作っておけば、毎回0から説明し直す必要がなくなる。</span></div>
  </div>

  <div class="card">
    <span class="num">03</span>
    <span class="badge b-main">作り方①</span>
    <h2>「提案して」で始めるのが最短ルート<small>履歴を見て、あなた向けのスペース案を出してくれる</small></h2>
    <p>作り方が迷ったら、Museに「<b>スペースを作りたいので提案して</b>」と伝えるだけ。Museは会話の履歴を見て、いま取り組んでいることに合ったスペースを提案してくれる。ワンダー佐藤氏の例では、研究中のテーマの<b>ダッシュボード</b>、執筆中の入門書の<b>進捗ページ</b>、Instagram・YouTube・noteなどの<b>発信制作のまとめ</b>が提案された。</p>
    <div class="flow">
      <div class="step"><b>STEP 1</b>「スペース作りたいので提案して」と依頼</div>
      <div class="step"><b>STEP 2</b>履歴を踏まえた候補が表示される</div>
      <div class="step"><b>STEP 3</b>ポチッと押すだけで作成完了</div>
    </div>
  </div>

  <div class="card">
    <span class="num">04</span>
    <span class="badge b-acc">作り方②</span>
    <h2>作成ボタンから新規作成する方法<small>スマホではライブラリーの下に「スペース」</small></h2>
    <p>作ったスペースは画面左側の一覧に入ってくる。スマホの場合は<b>サイドチャットの上・ライブラリーの下</b>に「スペース」の項目が現れるので、<b>プラスボタンの「スペースを作成」</b>を押せばプロンプト入力欄が出る。作りたいものを入力してもよいし、<b>空欄ならMuse側が提案してくれる</b>。履歴を見て作ってくれるので、積極的にアイデアを出して作ってもらうのもおすすめ。</p>
  </div>

  <div class="card">
    <span class="num">05</span>
    <span class="badge b-main">実例①</span>
    <h2>AIとの小説共同制作を「まとめサイト」化<small>あらすじ・制作記録が読みやすくなり、テンションも上がる</small></h2>
    <p>Muse上のAIキャラ「ムース」と小説を共同制作している例。チャットの長文を毎回読むのは大変だが、スペースにすると<b>あらすじを読む・制作の記録</b>といった形で整理され、かなり見やすくなる。可愛いイラストも入って楽しげ。中身はHTMLで作られているとみえ、<b>まとめサイトを見ているような感覚</b>で読み進められる。</p>
    <div class="note"><div class="ic">📖</div><div class="bubble2">小説だけでなく、AIとのミーティング履歴も同じように視覚化すると「今どんなことをやってるんだ」がひと目で分かる。</div></div>
  </div>

  <div class="card">
    <span class="num">06</span>
    <span class="badge b-acc">運用のコツ</span>
    <h2>スペースは自動更新されない ── 更新の指示を先に入れておく<small>「更新されたら反映して」か「更新ボタン」の2択</small></h2>
    <p>スペースは一度作ると<b>自動では更新されない</b>。対策は2つ。「元の情報が更新されたらスペースも更新して」と<b>事前に命令しておく</b>方法と、スペース側に<b>更新ボタンを付けてもらう</b>方法だ。ボタンを付ければアプリらしい操作感になり、押すだけで最新状態に変わる。</p>
    <div class="bubble"><span class="who">ポイント</span><span class="txt">更新ボタンを付けて押すと最新にアップデートされる──これで単なる情報ページが「アプリ」に変わる。</span></div>
  </div>

  <div class="card">
    <span class="num">07</span>
    <span class="badge b-main">実例②</span>
    <h2>入門書の進捗ページ ── フォルダーとGoogleドライブ連携<small>リンク先までMuseが自立的に用意してくれる</small></h2>
    <p>Meta Muse入門書の執筆進捗もスペース化。こちらは<b>フォルダーが付いており、開くとGoogleドライブへのリンク</b>があってそのまま飛べる。ドライブ側のリンク作成までMuseが自立的にやってくれるので「気が効く」という印象。今どこまで書けているかがひと目で分かる進捗ページとして機能する。</p>
    <ul>
      <li>執筆の進捗が視覚的に分かる</li>
      <li>フォルダーからドライブの成果物へ直接アクセス</li>
      <li>周辺の整備もMuseが自律的に実行</li>
    </ul>
  </div>

  <div class="card">
    <span class="num">08</span>
    <span class="badge b-acc">実例③</span>
    <h2>「ムースの学習内容」に更新ボタンを付けた<small>見るだけのページが、リアルタイム更新できるアプリに</small></h2>
    <p>AIキャラが自分の活動について検索・学習した内容を一覧できるスペース。ここに「<b>更新するボタンを付けて</b>」と頼むと、ボタンを押すたびに学習内容が最新状態へアップデートされるようになった。メインチャットでプロンプトを入れれば<b>スペースのサイトがアプリのように変わっていく</b>──これがスペースの育て方の基本パターン。見るだけならサイトのままで十分、さらに便利にしたければアプリ化していく。</p>
  </div>

  <div class="card">
    <span class="num">09</span>
    <span class="badge b-main">実演①</span>
    <h2>スキルから作る「動画生成アプリ」<small>テーマを入れるだけで台本からサムネまで生成</small></h2>
    <p>Museでは動画生成が可能（例:「11月5日 ダウ3.44%」のようなニュース解説動画を、概要欄・サムネ付きで生成）。これを<b>スペースのアプリ</b>にしたのが動画生成アプリだ。テーマを入れると台本では<b>A進行・B解説の2人掛け合い</b>のセリフが自動生成され、サムネイル・概要欄・チャプターまで揃う。</p>
    <div class="flow">
      <div class="step"><b>テーマ</b>入力（タイトルがなければ自動で生成）</div>
      <div class="step"><b>形式</b>イラスト入り解説 or コーディングのみ</div>
      <div class="step"><b>長さ・比率</b>1分・5分などの目安、縦型9:16も</div>
      <div class="step"><b>生成</b>入れたい内容をセクションで指定し実行</div>
    </div>
  </div>

  <div class="card">
    <span class="num">10</span>
    <span class="badge b-acc">実演①の成果</span>
    <h2>概要欄は「完璧」、プロフィールやハッシュタグまで生成<small>初回の品質は荒いが、指定した要件は再現される</small></h2>
    <p>実際に「Meta Museの新機能スペースを追加」というテーマで生成を実行。台本に加え、<b>サムネイル・概要欄・この動画で分かること・チャプター・プロフィール・ハッシュタグ</b>まで自動で揃い、概要欄は「もうこれで完璧」という出来。プロンプトで指定した<b>タスクのスキル化・画像生成・ノードを作ってレンダリング</b>といった要件はきちんと再現された。</p>
    <div class="note"><div class="ic">✅</div><div class="bubble2">ただし最初から完璧ではない。「2人で解説」といった構成の粗は、ここからデザイン・構成を指示して改良していくのが現実的な使い方。</div></div>
  </div>

  <div class="card">
    <span class="num">11</span>
    <span class="badge b-main">課題と改良</span>
    <h2>動画アプリで見つかった改善点3つ<small>進捗表示・尺のブレ・完成ファイルの場所</small></h2>
    <p>実演で見えた課題も正直に紹介。①<b>レンダリングの進捗</b>が分かりにくい─ゲージやパーセント表示があるといい。②<b>尺の目安がブレる</b>─3分と指定したのに1分31秒で完成した。③<b>完成ファイルの場所が分からない</b>─自分ならGoogleドライブに保存する形に改良したい。なお場所は<b>サイドチャットに聞けば教えてくれた</b>。</p>
    <div class="bubble"><span class="who">学び</span><span class="txt">分からないことはサイドチャットに聞く。スペースとサイドチャットは併用するのが自然な使い方。</span></div>
  </div>

  <div class="card">
    <span class="num">12</span>
    <span class="badge b-acc">実演②</span>
    <h2>スキルから作る「スライド生成アプリ」<small>PowerPoint形式で、PDF・JPEG出力にも対応</small></h2>
    <p>もう1本がスライド生成アプリ。基本は<b>PowerPointで作ってくれ</b>、必要に応じてPDFやJPEGも出力できる。設定項目が豊富で、実務にそのまま使える。</p>
    <ul>
      <li>テーマ・タイトル・対象（誰向けの資料か）</li>
      <li>枚数（15枚まで。増やすことも可能）</li>
      <li>イラストの雰囲気（アニメ風／リアル風）と背景</li>
      <li>ロゴマークを紐付け（Googleドライブ内のファイル）</li>
      <li>入れたい内容をセクション単位で指定 → プロジェクト作成</li>
    </ul>
  </div>

  <div class="card">
    <span class="num">13</span>
    <span class="badge b-main">実験</span>
    <h2>タイトルだけで15枚のスライドが生成できるか試した<small>ChatGPTでリサーチしたニュースをテーマに実験</small></h2>
    <p>「今日の生成AIニュースで一番重要なものを1つリサーチ」をChatGPTで実行し、見つけたGemini関連のニュースを<b>タイトルだけ</b>スライドアプリに入れてプロジェクト作成。構成の生成→表紙→全15枚と進み、まず<b>文字だけが先にレンダリング</b>され、その後イラスト生成で一気に完成した。テーマを入れただけで自動検索も動く。</p>
    <div class="flow">
      <div class="step"><b>入力</b>タイトル1行だけ</div>
      <div class="step"><b>構成</b>目次と表紙が自動生成</div>
      <div class="step"><b>下書き</b>15枚の文字が先に描画</div>
      <div class="step"><b>完成</b>イラスト投入で仕上がる</div>
    </div>
  </div>

  <div class="card">
    <span class="num">14</span>
    <span class="badge b-acc">改良の気づき</span>
    <h2>「一括生成ボタン」があるとアプリらしい<small>後から編集できるとエージェンティックなアプリになる</small></h2>
    <p>実験中は構成確認やイラスト生成のボタンを順に押す必要があり、<b>どこを押すべきか分かりにくい</b>場面があった。ここは「自動で作って」を1回で済ませる<b>一括生成ボタン</b>を作っておくのが良い、という気づき。ボタン1つで作れて、後から編集できる──そういう作りにすると<b>エージェンティックなアプリ</b>になる。</p>
  </div>

  <div class="card">
    <span class="num">15</span>
    <span class="badge b-main">スキルからの生成</span>
    <h2>アプリは「履歴→ログ→スキル化→アプリ化」で作る<small>安定させたいならスキル経由がおすすめ</small></h2>
    <p>2つのアプリはどちらも<b>スキルを作り、そのスキルからアプリ化</b>する手順で生成した。流れは、まず普通に履歴を作ってログを取り、そのタスクを<b>スキル化</b>。そこからサイドチャット化してもいいし、スペースのアプリにしてもいい。スキルがなくてもプロンプトと履歴だけで作れるが、<b>安定させたいならスキル</b>、というのが使い分けの目安。</p>
    <div class="flow">
      <div class="step"><b>1. 履歴</b>普通にやり取りして型を作る</div>
      <div class="step"><b>2. スキル化</b>タスクをスキルとして固定</div>
      <div class="step"><b>3. 展開</b>サイドチャット or スペースのアプリへ</div>
    </div>
  </div>

  <div class="card">
    <span class="num">16</span>
    <span class="badge b-acc">使い分け</span>
    <h2>サイドチャット vs スペース ── どう使い分ける？<small>プロンプトで使うか、ボタンで使うか</small></h2>
    <div class="vs">
      <div class="col a"><h3>サイドチャット向き</h3><ul><li>プロンプトをダラダラ書いて説明した方が早い作業</li><li>テキスト情報のままで足りる場合</li><li>試行錯誤しながら進めたいとき</li></ul></div>
      <div class="col"><h3>スペース（アプリ）向き</h3><ul><li>繰り返し何度も使う作業</li><li>ボタン1つで実行したい</li><li>図や視覚情報でひと目で把握したい</li></ul></div>
    </div>
    <p>どちらでもできることは同じ。まずサイドチャットで使ってみて、<b>使いにくくなったらスペースに移す</b>という順番でもよい。</p>
  </div>

  <div class="card">
    <span class="num">17</span>
    <span class="badge b-main">正直なところ</span>
    <h2>最初の成果物の品質は「めちゃくちゃ悪い」<small>でも指定した要件は再現される。ここから育てる</small></h2>
    <p>初回に生成されたスペースの品質は正直良くない。構成の粗やデザインの違和感は、<b>好きなデザイン・構成を指示しながら改良</b>していくしかない。ただしプロンプトで入れた部分（タスクのスキル化、画像生成、ノードを作ってレンダリングする流れなど）は<b>ちゃんと再現される</b>ので、指定の仕方次第で確実に近づいていく。「最初はこんなもの」から始めて、繰り返し使うものだけアプリ化していくのが現実的な距離感だ。</p>
  </div>

  <div class="card full">
    <span class="num">18</span>
    <span class="badge b-acc">まとめ</span>
    <h2>スペースの使い方 ── 見せる・まとめる・アプリ化する<small>ワンダー佐藤氏が今後使っていく順番</small></h2>
    <p>スペースの本領は、<b>まとめサイトのように分かりやすくすること</b>。イラストや図を入れて一目で分かる・見ていて楽しげなものを作るのが第一歩で、それを<b>繰り返し使う作業ならアプリ化</b>してボタンで回す。プロンプトで使いたいのかボタンで使いたいのか、テキスト情報で見たいのか視覚情報で見たいのか──その判断でサイドチャットとスペースを使い分ければいい。</p>
    <div class="flow">
      <div class="step"><b>作る</b>「提案して」またはスペース作成ボタンから</div>
      <div class="step"><b>見る</b>進捗・記録をサイトのように可視化</div>
      <div class="step"><b>育てる</b>更新ボタンや一括生成ボタンを追加</div>
      <div class="step"><b>使い分け</b>繰り返し使うならアプリ、試行錯誤はサイドチャット</div>
    </div>
    <div class="note"><div class="ic">▶</div><div class="bubble2">使い方が分からなければ、まずMuse自身に「スペース作りたいので提案して」と聞いてみるのが一番の近道。</div></div>
  </div>
